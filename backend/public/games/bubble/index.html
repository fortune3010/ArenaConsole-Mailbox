<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubble Arena</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#05060f;--fg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05060f}}
:root[data-theme="dark"]{--bg:#05060f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:system-ui,sans-serif}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5vmin;background:rgba(3,6,20,.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#th{display:grid;grid-template-columns:repeat(4,1fr);gap:2.4vmin;width:min(90vw,520px)}
#th canvas{width:100%;aspect-ratio:3/4;border-radius:14px;border:2px solid rgba(255,255,255,.25);cursor:pointer;transition:.2s;display:block}
#th canvas.on{border-color:#7ff;box-shadow:0 0 22px #4ef,0 0 4px #fff;transform:scale(1.06)}
#np{display:flex;gap:3vmin}
.n{display:flex;gap:6px;padding:13px 20px;border-radius:30px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);cursor:pointer;transition:.2s}
.n i{width:12px;height:12px;border-radius:50%;background:#fff;opacity:.9}
.n.on{border-color:#7ff;box-shadow:0 0 18px #4ef;background:rgba(80,220,255,.18)}
#go{width:88px;height:88px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:radial-gradient(circle at 35% 30%,#8ff,#27b 60%,#145);box-shadow:0 0 34px rgba(80,230,255,.6);cursor:pointer;position:relative}
#go::after{content:"";position:absolute;left:36px;top:25px;border-left:28px solid #fff;border-top:19px solid transparent;border-bottom:19px solid transparent}
button{font:700 15px system-ui;color:#fff;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);border-radius:26px;padding:12px 18px;cursor:pointer;transition:.15s}button:active{transform:scale(.95)}
#cfg,#net{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(3,6,20,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:30}#cfg.on,#net.on{display:flex}#net{z-index:40}
#cfgb{box-sizing:border-box;width:min(92vw,460px);max-height:78vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(20,28,60,.7)}#cfgb h2{margin:0 0 4px;font:900 20px system-ui}
.cr label{display:block;font:600 13px system-ui;opacity:.85;margin-bottom:6px}.sg{display:flex;gap:6px;flex-wrap:wrap}.sg button{padding:8px 13px;font-size:13px;border-radius:18px}.sg button.on{border-color:#7ff;background:rgba(80,220,255,.22);box-shadow:0 0 12px #4ef}
#netc{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;max-width:86vw}#netc b{font:900 20px system-ui}#netc span{font:500 14px/1.4 system-ui;opacity:.85}.code{font:900 30px system-ui;letter-spacing:6px;color:#7ff;text-shadow:0 0 14px #4ef;user-select:all}
.sp{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#7ff;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,30px);opacity:0;padding:10px 16px;border-radius:20px;background:rgba(10,16,40,.9);border:1px solid rgba(255,255,255,.25);font:600 13px system-ui;pointer-events:none;transition:.25s;z-index:50}#toast.on{opacity:1;transform:translate(-50%,0)}
#bCfg{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:44px;height:44px;padding:0;border-radius:50%;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center}
</style>
<script>
(function(){
  window.__gaLaunch=function(payload){
    try{
      var p = payload ? (typeof payload==='string'?JSON.parse(payload):payload) : {};
      if(!payload){
        try{var raw=window.AndroidNet&&AndroidNet.takeLaunch();if(raw)p=JSON.parse(raw);}catch(e){}
      }
      var q=new URLSearchParams(location.search);
      if(p.room)q.set('room',p.room);if(p.code)q.set('room',p.code);
      if(p.role)q.set('role',p.role);
      if(p.token)q.set('token',p.token);
      if(p.players)q.set('players',p.players);
      if(p.scenario)q.set('scenario',p.scenario);
      q.set('start','1');
      if(q.get('prewarm')!==null){
        q.delete('prewarm');
        history.replaceState(null,'',location.pathname+'?'+q.toString()+location.hash);
        location.reload();
      }
    }catch(e){console.error('[GA] __gaLaunch error',e)}
  };
  window.__gaWake=function(){try{if(window.GANet&&GANet.wakeAll&&GANet.wakeAll())return;}catch(e){}
    try{if(window.socket&&!window.socket.connected)window.socket.connect();}catch(e){}
  };
})();
</script>
