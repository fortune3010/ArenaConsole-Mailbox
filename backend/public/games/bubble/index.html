<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bubble Arena</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#03101a;--fg:#fff;--cy:#5ef2ff;--pk:#ff5fc8;--yl:#ffd83a;--or:#ff8a1e;--pu:#6a2be0;--gn:#7dff9a;--ff:"Baloo 2","Fredoka","Nunito",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#03101a}}
:root[data-theme="dark"]{--bg:#03101a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--ff);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}

/* ---------- Menu ---------- */
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;
 background:radial-gradient(120% 55% at 50% 0%,rgba(24,170,150,.34),transparent 62%),radial-gradient(95% 45% at 50% 100%,rgba(110,220,70,.2),transparent 66%),radial-gradient(60% 40% at 8% 58%,rgba(123,60,255,.26),transparent 70%),radial-gradient(60% 40% at 94% 40%,rgba(255,95,200,.16),transparent 70%),linear-gradient(180deg,rgba(2,16,24,.8),rgba(3,9,26,.88));
 backdrop-filter:blur(9px) saturate(1.25);-webkit-backdrop-filter:blur(9px) saturate(1.25)}
/* scroll lives here so the decoration layer and the settings button stay put */
.mw{position:absolute;inset:0;display:flex;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
 padding:calc(env(safe-area-inset-top,0px) + 58px) 0 calc(env(safe-area-inset-bottom,0px) + 22px);box-sizing:border-box}
.mw::-webkit-scrollbar{display:none}
.mi{margin:auto;width:min(90vw,440px);display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.4vh,22px)}
.mi>*{animation:rise .6s cubic-bezier(.2,.9,.3,1.25) both}
.mi>:nth-child(2){animation-delay:.08s}.mi>:nth-child(3){animation-delay:.16s}.mi>:nth-child(4){animation-delay:.24s}

/* floating bubbles + sparkles */
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.fx span{position:absolute;bottom:-70px;width:var(--s,34px);height:var(--s,34px);border-radius:50%;opacity:.5;
 background:radial-gradient(circle at 32% 28%,#fff 0,rgba(255,255,255,.75) 9%,var(--c) 34%,var(--d) 100%);
 box-shadow:inset 0 -5px 10px rgba(0,0,0,.28),0 0 16px var(--c);animation:float var(--t,11s) linear infinite;animation-delay:var(--dl,0s)}
.fx span:nth-child(1){left:5%;--s:38px;--c:#3aa8ff;--d:#0b3fb8;--t:12s}
.fx span:nth-child(2){left:22%;--s:22px;--c:#ff6fc4;--d:#b3126f;--t:9s;--dl:-3s}
.fx span:nth-child(3){left:41%;--s:30px;--c:#ffa63a;--d:#c44d00;--t:14s;--dl:-7s}
.fx span:nth-child(4){left:63%;--s:18px;--c:#7dff9a;--d:#0d8a3a;--t:10s;--dl:-5s}
.fx span:nth-child(5){left:78%;--s:42px;--c:#ff6fc4;--d:#b3126f;--t:15s;--dl:-9s}
.fx span:nth-child(6){left:90%;--s:26px;--c:#3aa8ff;--d:#0b3fb8;--t:11s;--dl:-1s}
.fx span:nth-child(7){left:52%;--s:16px;--c:#c58bff;--d:#5a1fd0;--t:8s;--dl:-6s}
.fx span:nth-child(8){left:13%;--s:20px;--c:#ffe03a;--d:#d47a00;--t:13s;--dl:-10s}
.fx em{position:absolute;width:var(--s,16px);height:var(--s,16px);background:radial-gradient(circle,#fff 0,#fff6b0 45%,#ffd83a 100%);
 clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);animation:twinkle var(--t,2.6s) ease-in-out infinite;animation-delay:var(--dl,0s)}
.fx em:nth-of-type(1){left:9%;top:17%;--s:20px}
.fx em:nth-of-type(2){left:86%;top:13%;--s:26px;--dl:-.9s}
.fx em:nth-of-type(3){left:70%;top:31%;--s:12px;--dl:-1.7s;--t:3.2s}
.fx em:nth-of-type(4){left:18%;top:44%;--s:14px;--dl:-.4s;--t:3.4s}
.fx em:nth-of-type(5){left:91%;top:60%;--s:18px;--dl:-2.1s}
.fx em:nth-of-type(6){left:6%;top:76%;--s:14px;--dl:-1.2s;--t:2.2s}
.fx em:nth-of-type(7){left:80%;top:88%;--s:20px;--dl:-.6s;--t:3s}

/* logo */
.lw{position:relative;display:flex;flex-direction:column;align-items:center;padding:0 6px}
.lg{position:relative;z-index:1;display:flex;justify-content:center;font:900 clamp(46px,min(21vw,13.5vh),104px)/1.05 var(--ff);letter-spacing:.01em;
 filter:drop-shadow(0 0 1.5px #ffd0ff) drop-shadow(0 0 12px rgba(255,80,210,.85)) drop-shadow(0 7px 10px rgba(10,0,50,.6))}
.lg b{position:relative;display:inline-block;font-weight:900;color:transparent;animation:bob 2.8s ease-in-out infinite;animation-delay:calc(var(--i,0)*.13s)}
.lg b::before,.lg b::after{content:attr(data-c);position:absolute;left:0;top:0}
.lg b::before{color:var(--pu);-webkit-text-stroke:.26em var(--pu);text-shadow:0 .07em 0 #3a0f96}
.lg b::after{background:linear-gradient(180deg,#fffbd0 0%,#ffe84a 26%,#ffc21f 55%,#ff8a1e 82%,#f2600f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.035em #fff3a0}
.lg b:nth-child(2){--i:1}.lg b:nth-child(3){--i:2}.lg b:nth-child(4){--i:3}.lg b:nth-child(5){--i:4}.lg b:nth-child(6){--i:5}
.ob{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0,rgba(255,255,255,.8) 8%,var(--c) 36%,var(--d) 100%);
 box-shadow:inset 0 -6px 12px rgba(0,0,0,.3),0 0 18px var(--c);animation:bob 3.4s ease-in-out infinite}
.ob:nth-of-type(1){--s:clamp(30px,11vmin,54px);--c:#3aa8ff;--d:#0b3fb8;left:24%;top:-14%}
.ob:nth-of-type(2){--s:clamp(34px,12vmin,60px);--c:#ff6fc4;--d:#b3126f;left:-3%;top:46%;animation-delay:-1.1s}
.ob:nth-of-type(3){--s:clamp(26px,9vmin,46px);--c:#ff6fc4;--d:#b3126f;right:24%;top:-10%;animation-delay:-.6s}
.ob:nth-of-type(4){--s:clamp(26px,9vmin,46px);--c:#ffa63a;--d:#c44d00;right:0;top:50%;animation-delay:-1.9s}
.tg{position:relative;z-index:1;margin-top:-.2em;padding:3px 16px 3px 22px;border-radius:99px;font:900 clamp(11px,3.4vmin,15px)/1.5 var(--ff);letter-spacing:.42em;color:#eaffff;
 background:linear-gradient(90deg,rgba(94,242,255,.28),rgba(255,95,200,.28));border:1px solid rgba(255,255,255,.4);box-shadow:0 0 16px rgba(94,242,255,.55),inset 0 1px 0 rgba(255,255,255,.4);text-shadow:0 0 8px var(--cy)}

/* glass cards */
.cd{box-sizing:border-box;width:100%;padding:clamp(9px,1.6vh,14px) 14px clamp(11px,1.9vh,16px);border-radius:24px;position:relative;
 background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 45%,rgba(94,242,255,.07));border:1px solid rgba(255,255,255,.24);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.25),0 14px 34px rgba(0,0,0,.45)}
.lb{display:flex;align-items:center;gap:8px;margin:0 2px clamp(6px,1.2vh,10px);font:800 12px/1 var(--ff);letter-spacing:.2em;text-transform:uppercase;color:#d8fbff;text-shadow:0 0 10px rgba(94,242,255,.7)}
.lb::before{content:"";width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--cy) 55%,#0a7fa0);box-shadow:0 0 10px var(--cy)}
.lb::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(94,242,255,.55),transparent)}

#th{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(7px,2.2vmin,12px);width:min(100%,50vh);margin:0 auto}
#th canvas{width:100%;height:clamp(48px,10.5vh,112px);object-fit:cover;border-radius:14px;border:2px solid rgba(255,255,255,.22);cursor:pointer;transition:transform .22s cubic-bezier(.2,.9,.3,1.4),box-shadow .22s,border-color .22s,filter .22s;display:block;box-sizing:border-box;filter:saturate(.8) brightness(.8);box-shadow:0 4px 10px rgba(0,0,0,.4)}
#th canvas:active{transform:scale(.94)}
#th canvas.on{border-color:#fff;filter:none;box-shadow:0 0 0 2px var(--cy),0 0 22px var(--cy),0 0 44px rgba(94,242,255,.45);transform:translateY(-3px) scale(1.07)}

#np{display:flex;gap:clamp(8px,2.6vmin,14px);width:100%}
.n{flex:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:5px;padding:9px 6px 10px;border-radius:18px;border:1.5px solid rgba(255,255,255,.22);
 background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.3);cursor:pointer;transition:transform .2s cubic-bezier(.2,.9,.3,1.4),box-shadow .2s,border-color .2s,background .2s}
.n:active{transform:scale(.94)}
.n b{flex:0 0 100%;text-align:center;font:900 clamp(18px,5.4vmin,24px)/1 var(--ff);color:rgba(255,255,255,.75);transition:.2s}
.n i{width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff 0,var(--c,#9cf) 42%,var(--d,#27b) 100%);box-shadow:inset 0 -2px 3px rgba(0,0,0,.3);opacity:.75;transition:.2s}
.n i:nth-of-type(1){--c:#4db4ff;--d:#0b3fb8}.n i:nth-of-type(2){--c:#ff6fc4;--d:#b3126f}.n i:nth-of-type(3){--c:#ffb04a;--d:#c44d00}.n i:nth-of-type(4){--c:#7dff9a;--d:#0d8a3a}
.n.on{border-color:#fff;background:linear-gradient(180deg,rgba(94,242,255,.38),rgba(123,60,255,.3));box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 2px rgba(94,242,255,.55),0 0 22px rgba(94,242,255,.7);transform:translateY(-2px)}
.n.on b{color:#fff;text-shadow:0 0 12px var(--cy)}
.n.on i{opacity:1;box-shadow:inset 0 -2px 3px rgba(0,0,0,.3),0 0 8px var(--c)}

/* play button */
.gw{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,1.4vh,12px);margin-top:clamp(2px,1vh,10px)}
#go{width:clamp(78px,min(25vw,14vh),112px);aspect-ratio:1;border-radius:50%;border:4px solid #fff6c0;box-sizing:border-box;position:relative;cursor:pointer;
 background:radial-gradient(circle at 34% 26%,#fffbd0 0,#ffe84a 20%,#ffb11f 56%,#f2600f 100%);
 box-shadow:inset 0 -9px 16px rgba(170,50,0,.55),inset 0 5px 10px rgba(255,255,255,.6),0 0 0 6px rgba(255,190,60,.2),0 0 40px rgba(255,190,60,.85),0 10px 22px rgba(0,0,0,.5);
 animation:pulse 1.7s ease-in-out infinite;transition:filter .15s}
#go:active{filter:brightness(1.2);animation-play-state:paused}
#go::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:2px solid rgba(255,225,110,.9);animation:ring 1.7s ease-out infinite;pointer-events:none}
#go::after{content:"";position:absolute;left:50%;top:50%;width:36%;height:42%;transform:translate(-38%,-50%);background:#fff;clip-path:polygon(4% 0,100% 50%,4% 100%,0 92%,0 8%)}
#go.setup{border-color:#d9ffe6;background:radial-gradient(circle at 34% 26%,#eafff0 0,#7dff9a 22%,#19c463 58%,#067a3c 100%);box-shadow:inset 0 -9px 16px rgba(0,80,40,.55),inset 0 5px 10px rgba(255,255,255,.6),0 0 0 6px rgba(125,255,154,.2),0 0 40px rgba(125,255,154,.8),0 10px 22px rgba(0,0,0,.5)}
#go.setup::before{border-color:rgba(160,255,190,.9)}
#go.setup::after{width:50%;height:44%;transform:translate(-50%,-50%);clip-path:polygon(0 54%,14% 40%,36% 62%,86% 8%,100% 22%,36% 92%)}
.gl{font:900 clamp(14px,4.4vmin,18px)/1 var(--ff);letter-spacing:.3em;padding-left:.3em;color:#fff7c8;text-shadow:0 0 12px rgba(255,190,60,.95),0 2px 0 rgba(120,40,0,.7)}
.gl::after{content:"JOGAR"}
#go.setup+.gl{color:#e2ffea;text-shadow:0 0 12px rgba(125,255,154,.95),0 2px 0 rgba(0,70,30,.7)}
#go.setup+.gl::after{content:"GUARDAR"}

/* ---------- Buttons ---------- */
button{font:800 15px var(--ff);color:#fff;border:1.5px solid rgba(255,255,255,.3);background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));border-radius:26px;padding:12px 18px;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}button:active{transform:scale(.95)}
#bCfg{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:44px;height:44px;padding:0;border-radius:50%;font-size:21px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;
 border-color:rgba(94,242,255,.7);background:linear-gradient(160deg,rgba(94,242,255,.3),rgba(123,60,255,.28));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 16px rgba(94,242,255,.55),0 6px 14px rgba(0,0,0,.4)}
#bCfg:active{transform:scale(.9) rotate(60deg)}
#cfgx,#netb{min-width:168px;padding:13px 26px;font-size:16px;letter-spacing:.06em;border:1.5px solid rgba(255,255,255,.7);color:#04222c;
 background:linear-gradient(180deg,#b8fbff 0%,#5ef2ff 45%,#2bb6e8 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),inset 0 -4px 8px rgba(0,90,130,.35),0 0 24px rgba(94,242,255,.65),0 8px 18px rgba(0,0,0,.45)}

/* ---------- Settings + network sheets ---------- */
#cfg,#net{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;
 background:radial-gradient(90% 50% at 50% 0%,rgba(24,170,150,.28),transparent 65%),radial-gradient(70% 45% at 50% 100%,rgba(123,60,255,.3),transparent 70%),rgba(2,10,22,.86);
 backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);z-index:30}#cfg.on,#net.on{display:flex;animation:fade .25s both}#net{z-index:40}
#cfg.on>*,#net.on>*{animation:pop .38s cubic-bezier(.2,.9,.3,1.3) both}
#cfgb{box-sizing:border-box;width:min(92vw,460px);max-height:74vh;overflow-y:auto;display:flex;flex-direction:column;gap:13px;padding:18px 16px;border-radius:26px;border:1px solid rgba(255,255,255,.26);
 background:linear-gradient(165deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 40%,rgba(94,242,255,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 20px 50px rgba(0,0,0,.55),0 0 34px rgba(94,242,255,.16);scrollbar-width:thin;scrollbar-color:rgba(94,242,255,.5) transparent}
#cfgb::-webkit-scrollbar{width:4px}#cfgb::-webkit-scrollbar-thumb{background:rgba(94,242,255,.5);border-radius:4px}
#cfgb h2{margin:0 0 2px;font:900 24px/1.2 var(--ff);letter-spacing:.02em;text-align:center;background:linear-gradient(180deg,#fffbd0,#ffd83a 45%,#ff8a1e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,170,40,.55))}
.cr{padding-top:11px;border-top:1px solid rgba(255,255,255,.1)}
.cr label{display:block;font:800 11px var(--ff);letter-spacing:.14em;text-transform:uppercase;color:#c9f8ff;opacity:.9;margin-bottom:8px}
.sg{display:flex;gap:7px;flex-wrap:wrap}.sg button{flex:1 1 auto;padding:9px 13px;font-size:13px;border-radius:16px;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.07)}
.sg button.on{border-color:#fff;color:#04222c;background:linear-gradient(180deg,#b8fbff,#5ef2ff 55%,#2bb6e8);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 0 16px rgba(94,242,255,.75)}
#netc{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:min(86vw,400px);padding:26px 20px 22px;border-radius:26px;border:1px solid rgba(255,255,255,.26);
 background:linear-gradient(165deg,rgba(255,255,255,.16),rgba(255,255,255,.04) 40%,rgba(94,242,255,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 20px 50px rgba(0,0,0,.55),0 0 34px rgba(94,242,255,.16)}
#netc b{font:900 21px/1.25 var(--ff);text-shadow:0 0 14px rgba(94,242,255,.6)}#netc span{font:600 14px/1.45 var(--ff);opacity:.85}#netc span:empty{display:none}#netc button{margin-top:6px}
.code{font:900 30px var(--ff);letter-spacing:6px;color:var(--cy);text-shadow:0 0 14px #4ef;-webkit-user-select:all;user-select:all}
.sp{width:46px;height:46px;border-radius:50%;border:5px solid rgba(255,255,255,.14);border-top-color:var(--cy);border-right-color:var(--pk);box-shadow:0 0 18px rgba(94,242,255,.45);animation:spin .9s linear infinite}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translate(-50%,30px) scale(.9);opacity:0;max-width:86vw;box-sizing:border-box;padding:11px 18px;border-radius:22px;text-align:center;
 background:linear-gradient(180deg,rgba(20,44,66,.94),rgba(8,16,40,.94));border:1px solid rgba(94,242,255,.6);box-shadow:0 0 20px rgba(94,242,255,.4),0 8px 20px rgba(0,0,0,.5);font:700 13px var(--ff);pointer-events:none;transition:.3s cubic-bezier(.2,.9,.3,1.4);z-index:50}#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.96)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7%) rotate(-2deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes ring{0%{transform:scale(.86);opacity:.9}100%{transform:scale(1.4);opacity:0}}
@keyframes float{0%{transform:translate(0,0) scale(.85)}50%{transform:translate(18px,-55vh) scale(1)}100%{transform:translate(-10px,-112vh) scale(.9)}}
@keyframes twinkle{0%,100%{transform:scale(.25) rotate(0);opacity:.15}50%{transform:scale(1) rotate(45deg);opacity:1}}
@media (max-height:660px){.tg{display:none}.mw{padding-top:calc(env(safe-area-inset-top,0px) + 36px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)}.lg{font-size:clamp(40px,min(18vw,10.5vh),72px)}.lb{font-size:11px}.n{padding:6px 6px 7px}#th canvas{height:clamp(44px,9.5vh,70px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<script>
(function(){
  window.__gaLaunch=function(payload){
    try{
      var p = payload ? (typeof payload==='string'?JSON.parse(payload):payload) : {};
      if(!payload){
        try{var raw=window.AndroidNet&&AndroidNet.takeLaunch();if(raw)p=JSON.parse(raw);}catch(e){}
      }
      var q=new URLSearchParams(location.search);
      if(p.room)q.set('room',p.room);if(p.code)q.set('room',p.code);
      if(p.role)q.set('role',p.role);
      if(p.token)q.set('token',p.token);
      if(p.players)q.set('players',p.players);
      if(p.scenario)q.set('scenario',p.scenario);
      q.set('start','1');
      if(q.get('prewarm')!==null){
        q.delete('prewarm');
        history.replaceState(null,'',location.pathname+'?'+q.toString()+location.hash);
        location.reload();
      }
    }catch(e){console.error('[GA] __gaLaunch error',e)}
  };
  window.__gaWake=function(){try{if(window.GANet&&GANet.wakeAll&&GANet.wakeAll())return;}catch(e){}
    try{if(window.socket&&!window.socket.connected)window.socket.connect();}catch(e){}
  };
})();
</script>
