<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Go!</title>
    
    <!-- Styles originais do jogo + HUD multiplayer overlay -->
    <style>
        /* ==================== ESTILOS ORIGINAIS DO JOGO ==================== */
        /* MANTER todos os estilos do Arrow Go.html original aqui */
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #000;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        
        /* ==================== HUD MULTIPLAYER (OVERLAY) ==================== */
        #multiplayerHUD {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Não bloqueia clicks no canvas */
            z-index: 1000;
            display: none; /* Oculto por default (single player) */
        }
        
        #multiplayerHUD.active {
            display: block;
        }
        
        .players-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            min-width: 200px;
        }
        
        .player-slot {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 16px;
            color: white;
        }
        
        .player-slot.empty {
            opacity: 0.3;
        }
        
        .player-icon {
            font-size: 24px;
            margin-right: 10px;
        }
        
        .player-name {
            flex: 1;
            font-weight: bold;
        }
        
        .player-lives {
            display: flex;
            gap: 3px;
        }
        
        .heart {
            font-size: 18px;
        }
        
        .heart.lost {
            opacity: 0.2;
        }
        
        #voiceControls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            pointer-events: all; /* Permite clicks nos botões */
        }
        
        .voice-btn {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #fff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            margin-left: 10px;
        }
        
        .voice-btn.active {
            background: rgba(0, 255, 0, 0.7);
        }
        
        #waitingModal, #gameOverModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            pointer-events: all;
        }
        
        .modal-content {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
        }
        
        .modal-content h2 {
            margin: 0 0 20px 0;
            font-size: 32px;
        }
        
        .modal-content p {
            font-size: 18px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <!-- Canvas original do jogo (MANTER TUDO) -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- ==================== HUD MULTIPLAYER (OVERLAY) ==================== -->
    <div id="multiplayerHUD">
        <!-- Players Container -->
        <div class="players-container">
            <div class="player-slot empty" data-slot="0">
                <span class="player-icon">🟢</span>
                <span class="player-name">Waiting...</span>
                <div class="player-lives"></div>
            </div>
            <div class="player-slot empty" data-slot="1">
                <span class="player-icon">🟡</span>
                <span class="player-name">Waiting...</span>
                <div class="player-lives"></div>
            </div>
            <div class="player-slot empty" data-slot="2">
                <span class="player-icon">🔴</span>
                <span class="player-name">Waiting...</span>
                <div class="player-lives"></div>
            </div>
            <div class="player-slot empty" data-slot="3">
                <span class="player-icon">⚪</span>
                <span class="player-name">Waiting...</span>
                <div class="player-lives"></div>
            </div>
            <div class="player-slot empty" data-slot="4">
                <span class="player-icon">🔵</span>
                <span class="player-name">Waiting...</span>
                <div class="player-lives"></div>
            </div>
            <div class="player-slot empty" data-slot="5">
                <span class="player-icon">🟣</span>
                <span class="player-name">Waiting...</span>
                <div class="player-lives"></div>
            </div>
        </div>
        
        <!-- Voice Controls -->
        <div id="voiceControls">
            <button class="voice-btn" id="micBtn" title="Mute/Unmute">🎤</button>
            <button class="voice-btn" id="speakerBtn" title="Mute Others">🔊</button>
        </div>
    </div>
    
    <!-- Waiting Modal -->
    <div id="waitingModal">
        <div class="modal-content">
            <h2>Waiting for players...</h2>
            <p id="playerCount">1 / 2 players</p>
            <p>Game starts when 2 players join</p>
        </div>
    </div>
    
    <!-- Game Over Modal -->
    <div id="gameOverModal">
        <div class="modal-content">
            <h2 id="gameOverTitle">Game Over</h2>
            <p id="gameOverMessage"></p>
        </div>
    </div>
    
    <!-- ==================== SCRIPTS ==================== -->
    
    <!-- 1. CÓDIGO ORIGINAL DO JOGO (Arrow Go.html - 33KB) -->
    <!-- COPIAR TODO O SCRIPT ORIGINAL DO Arrow Go.html AQUI -->

        // NOTA IMPORTANTE:
        // Quando tiveres o ficheiro original completo, copia todo o <script>

    <!-- 2. Socket.IO Client (apenas se multiplayer) -->
    <script src="/socket.io/socket.io.js"></script>
    
    <!-- 3. WebRTC Voice (apenas se multiplayer) -->
    <script src="voice.js"></script>
    
    <!-- 4. Multiplayer Integration (overlay sobre o jogo original) -->
    <script>
        // ===================================================================
        // MULTIPLAYER INTEGRATION (NÃO MODIFICA O JOGO ORIGINAL)
        // ===================================================================
        
        // Detecta se é multiplayer (room code na URL)
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room');
        const token = urlParams.get('token');
        const username = urlParams.get('username') || 'Player';
        
        const isMultiplayer = !!roomCode;
        
        if (!isMultiplayer) {
            console.log('[ARROW-GO] Modo Single Player');
            // Jogo original corre normalmente
            // HUD fica oculto
        } else {
            console.log('[ARROW-GO] Modo Multiplayer - Room:', roomCode);
            
            // Ativa HUD
            document.getElementById('multiplayerHUD').classList.add('active');
            
            // Socket.IO connection
            const socket = io('/arrow-go', {
                auth: { token }
            });
            
            let myPlayerId = null;
            let myColor = null;
            let gameStarted = false;
            let currentGameSeed = null;
            
            // Voice Manager
            let voiceManager = null;
            if (typeof VoiceManager !== 'undefined') {
                voiceManager = new VoiceManager(socket);
            }
            
            // ===== SOCKET.IO EVENTS =====
            
            socket.on('connect', () => {
                console.log('[SOCKET] Connected');
                socket.emit('join_room', { roomCode, username, token });
            });
            
            socket.on('room_joined', (data) => {
                console.log('[SOCKET] Room joined:', data);
                myPlayerId = data.yourId;
                myColor = data.yourColor;
                
                updatePlayersHUD(data.players);
                
                // Mostra waiting modal
                document.getElementById('waitingModal').style.display = 'flex';
                updatePlayerCount(data.players.length);
            });
            
            socket.on('player_joined', (data) => {
                console.log('[SOCKET] Player joined:', data.player);
                updatePlayerCount(null); // Atualiza via DOM
            });
            
            socket.on('game_start', (data) => {
                console.log('[SOCKET] Game starting with seed:', data.seed);
                currentGameSeed = data.seed;
                gameStarted = true;
                
                // Esconde waiting modal
                document.getElementById('waitingModal').style.display = 'none';
                
                updatePlayersHUD(data.players);
                
                // INICIAR O JOGO ORIGINAL AQUI
                // Chama a função de start do jogo original (se existir)
                // Exemplo: if (typeof startOriginalGame === 'function') startOriginalGame(data.seed);
                
                // Inicia voice chat
                if (voiceManager) {
                    data.players.forEach(p => {
                        if (p.id !== myPlayerId) {
                            voiceManager.connectToPeer(p.id);
                        }
                    });
                }
            });
            
            socket.on('player_life_lost', (data) => {
                console.log('[SOCKET] Player lost life:', data);
                updatePlayerLives(data.playerId, data.lives);
            });
            
            socket.on('player_eliminated', (data) => {
                console.log('[SOCKET] Player eliminated:', data);
                eliminatePlayer(data.playerId);
            });
            
            socket.on('game_over', (data) => {
                console.log('[SOCKET] Game over:', data);
                gameStarted = false;
                
                showGameOver(data);
                
                // Report to Android (se disponível)
                if (typeof AndroidInterface !== 'undefined') {
                    const result = data.winnerId === myPlayerId ? 'win' : 'lose';
                    AndroidInterface.reportMatchResult(result);
                }
                
                // Auto-close após 3s
                setTimeout(() => {
                    if (typeof AndroidInterface !== 'undefined') {
                        AndroidInterface.closeWebView();
                    }
                }, 3000);
            });
            
            socket.on('error', (data) => {
                console.error('[SOCKET] Error:', data.message);
                alert(data.message);
            });
            
            // ===== HOOK: PERDA DE VIDA (INTEGRAR NO JOGO ORIGINAL) =====
            
            // Esta função deve ser chamada DENTRO do código original
            // quando o jogo detectar colisão com obstáculo
            window.onPlayerLoseLife = function() {
                if (isMultiplayer && gameStarted) {
                    console.log('[MULTIPLAYER] Emitting lose_life');
                    socket.emit('lose_life', { roomCode });
                }
            };
            
            // INSTRUÇÕES DE INTEGRAÇÃO NO CÓDIGO ORIGINAL:
            // 1. Procura a função de colisão no código original
            // 2. Quando detectar colisão que remove vida, adiciona:
            //    if (typeof window.onPlayerLoseLife === 'function') {
            //        window.onPlayerLoseLife();
            //    }
            
            // ===== HUD FUNCTIONS =====
            
            function updatePlayersHUD(players) {
                const playerColors = ['green', 'yellow', 'red', 'white', 'blue', 'purple'];
                const playerIcons = ['🟢', '🟡', '🔴', '⚪', '🔵', '🟣'];
                
                players.forEach((player, index) => {
                    const slot = document.querySelector(`[data-slot="${index}"]`);
                    if (slot) {
                        slot.classList.remove('empty');
                        slot.querySelector('.player-icon').textContent = player.icon || playerIcons[index];
                        slot.querySelector('.player-name').textContent = player.username;
                        
                        const livesContainer = slot.querySelector('.player-lives');
                        livesContainer.innerHTML = '';
                        for (let i = 0; i < 3; i++) {
                            const heart = document.createElement('span');
                            heart.className = 'heart';
                            heart.textContent = '❤️';
                            if (i >= player.lives) {
                                heart.classList.add('lost');
                            }
                            livesContainer.appendChild(heart);
                        }
                    }
                });
            }
            
            function updatePlayerLives(playerId, lives) {
                const players = document.querySelectorAll('.player-slot:not(.empty)');
                players.forEach(slot => {
                    // Encontra player pelo playerId (necessita melhorar lógica)
                    const hearts = slot.querySelectorAll('.heart');
                    hearts.forEach((heart, index) => {
                        if (index >= lives) {
                            heart.classList.add('lost');
                        }
                    });
                });
            }
            
            function eliminatePlayer(playerId) {
                // Marca player como eliminado visualmente
                console.log('Player eliminated:', playerId);
            }
            
            function updatePlayerCount(count) {
                if (count === null) {
                    const activeSlots = document.querySelectorAll('.player-slot:not(.empty)').length;
                    count = activeSlots;
                }
                const playerCountEl = document.getElementById('playerCount');
                if (playerCountEl) {
                    playerCountEl.textContent = `${count} / 2 players`;
                }
            }
            
            function showGameOver(data) {
                const modal = document.getElementById('gameOverModal');
                const title = document.getElementById('gameOverTitle');
                const message = document.getElementById('gameOverMessage');
                
                if (data.winnerId === myPlayerId) {
                    title.textContent = '🎉 YOU WIN!';
                    message.textContent = 'Congratulations!';
                } else if (data.winnerId) {
                    title.textContent = '😢 GAME OVER';
                    message.textContent = `${data.winnerName} won!`;
                } else {
                    title.textContent = 'DRAW';
                    message.textContent = 'No winner';
                }
                
                modal.style.display = 'flex';
            }
            
            // Voice controls
            document.getElementById('micBtn')?.addEventListener('click', () => {
                if (voiceManager) {
                    voiceManager.toggleMic();
                    document.getElementById('micBtn').classList.toggle('active');
                }
            });
            
            document.getElementById('speakerBtn')?.addEventListener('click', () => {
                if (voiceManager) {
                    voiceManager.toggleSpeaker();
                    document.getElementById('speakerBtn').classList.toggle('active');
                }
            });
        }
        
        // ===================================================================
        // FIM DA MULTIPLAYER INTEGRATION
        // ===================================================================
    </script>
</body>
</html>
