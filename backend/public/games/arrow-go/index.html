<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arrow Go! - Multiplayer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HUD de Multiplayer -->
    <div id="multiplayerHUD" class="hud">
        <div id="playersStatus" class="players-grid">
            <!-- Será preenchido dinamicamente com os 6 jogadores -->
        </div>
        <div id="roomInfo" class="room-info">
            <span id="roomCode">Sala: ----</span>
            <span id="gameStatus">Aguardando jogadores...</span>
        </div>
    </div>

    <!-- Canvas do Jogo -->
    <canvas id="gameCanvas"></canvas>

    <!-- Controles de Voice Chat -->
    <div id="voiceControls" class="voice-controls">
        <button id="toggleMic" class="voice-btn" title="Microfone">
            🎤
        </button>
        <button id="toggleSpeaker" class="voice-btn" title="Alto-falante">
            🔊
        </button>
    </div>

    <!-- Modal de Espera -->
    <div id="waitingModal" class="modal">
        <div class="modal-content">
            <h2>🎮 Arrow Go! - Multiplayer</h2>
            <p id="waitingText">Conectando à sala...</p>
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="voice.js"></script>
    <script src="game.js"></script>
</body>
</html>
