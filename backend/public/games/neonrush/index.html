<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">

<style>

h1{margin:0;font:italic 900 clamp(52px,15vw,120px)/.9 Orbitron,'Arial Black',sans-serif;background:linear-gradient(#ffffff,#ffe680 42%,#ff9d1c);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#sub{margin:14px 0 0;letter-spacing:.2em;font-size:13px;color:#ffe9a6}
button{font:inherit;color:#fff;cursor:pointer}.row{display:flex;align-items:center;gap:12px;margin-top:14px}.row b{min-width:180px;font-size:15px;letter-spacing:.08em}.row button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.35)}#cs{display:block;font:12px system-ui,sans-serif;opacity:.85;margin-top:6px}#ov{overflow-y:auto}
#go{margin-top:26px;padding:16px 46px;font-weight:900;font-size:18px;letter-spacing:.22em;border:0;border-radius:999px;background:linear-gradient(90deg,#ff7a1a,#ffb31f);box-shadow:0 6px 26px rgba(255,130,20,.5)}

</style><style>
#go.net-blue{background:linear-gradient(90deg,#2f7bff,#5aa0ff);box-shadow:0 0 30px rgba(47,123,255,.6)}
.net-panel,.net-ui,#net-toast{font-family:Orbitron,'Arial Black',system-ui,sans-serif;color:#fff}
.net-panel{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);z-index:5;padding:8px 14px;border-radius:999px;background:rgba(11,2,33,.6);border:1px solid rgba(5,217,232,.6);font-size:12px;letter-spacing:.12em}
.net-ui{position:fixed;inset:0;z-index:6;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center;background:linear-gradient(rgba(11,2,33,.9),rgba(11,2,33,.97))}
.net-ui h2{margin:0;font-size:clamp(22px,6vw,38px);letter-spacing:.12em;color:#ffe66d}
.net-ui p{margin:0;color:#05d9e8;letter-spacing:.1em;font-size:13px}

.net-btn{padding:14px 34px;border:0;border-radius:999px;font:900 15px Orbitron,sans-serif;letter-spacing:.2em;color:#fff;background:linear-gradient(90deg,#2f7bff,#5aa0ff);box-shadow:0 0 24px rgba(47,123,255,.55)}
.net-btn.g{background:linear-gradient(90deg,#16a34a,#4ade80);box-shadow:0 0 24px rgba(74,222,128,.5)}.net-btn:disabled{opacity:.45}
#net-toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:7;padding:10px 18px;border-radius:12px;background:rgba(11,2,33,.92);opacity:0;transition:opacity .2s;pointer-events:none;font-size:12px}
</style><script src="/games/shared/ga-net.js?v=2"></script>
<script defer src="/ws/socket.io.min.js"></script>
<script>
(function(){
  window.__gaLaunch=function(payload){
    try{
      var p = payload ? (typeof payload==='string'?JSON.parse(payload):payload) : {};
      if(!payload){
        try{var raw=window.AndroidNet&&AndroidNet.takeLaunch();if(raw)p=JSON.parse(raw);}catch(e){}
      }
      var q=new URLSearchParams(location.search);
      if(p.room)q.set('room',p.room);if(p.code)q.set('room',p.code);
      if(p.role)q.set('role',p.role);
      if(p.token)q.set('token',p.token);
      if(p.players)q.set('players',p.players);
      q.set('start','1');
      if(q.get('prewarm')!==null){
        q.delete('prewarm');
        history.replaceState(null,'',location.pathname+'?'+q.toString()+location.hash);
        location.reload();
      }
    }catch(e){console.error('[GA] __gaLaunch error',e)}
  };
  window.__gaWake=function(){try{if(window.GANet&&GANet.wakeAll&&GANet.wakeAll())return;}catch(e){}
    try{if(window.socket&&!window.socket.connected)window.socket.connect();}catch(e){}
  };
})();
</script>
<script>(()=>{
// Camada de rede do NEON RUSH. Liga-se ao menu ORIGINAL do jogo (variáveis e funções globais do próprio jogo:
// ci, ki, NP, TRK, VEH, NSEL, pickCar, loadTrack, setMusic, info, startRace, initA, go, ov).
const Q=new URLSearchParams(location.search),mode=Q.get('mode'),isMp=!!Q.get('room')&&Q.get('start')==='1';
const N=window.__NET={hid:null};
document.documentElement.dataset.net=mode==='setup'?'setup':isMp?'mp':'err';
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let layer,bar;
const tst=m=>{let t=document.getElementById('net-toast');if(!t){t=el('div');t.id='net-toast';document.body.appendChild(t)}t.textContent=m;t.style.opacity=1;clearTimeout(tst.h);tst.h=setTimeout(()=>t.style.opacity=0,2400)};
const screen=h=>{if(!layer){layer=el('div','net-ui');document.body.appendChild(layer)}layer.style.display='flex';layer.innerHTML=h};
const err=m=>screen('<h2>NEON RUSH</h2><p>'+esc(m)+'</p>');
const tid=()=>TRK.slice(0,NSEL).map(t=>t.mu); // ids das pistas: costa, alpes, deserto, metropole, floresta, savana, cidade, lua

// ---- mode=setup: NÃO liga ao WebSocket. Veículo, pista e nº de pilotos = menu original; JOGAR (azul) entrega o setup ao app.
function setup(){
  go.textContent='JOGAR';go.classList.add('net-blue');
  go.onclick=()=>{const j=JSON.stringify({players:NP,map:TRK[ki].mu});
    try{window.AndroidInterface.saveSetup(j)}catch(e){console.warn('AndroidInterface.saveSetup indisponível:',j)}};
}

/* NR_P2P: corrida multijogador real — estrela WebRTC (Host <-> convidados); reserva pelo servidor (nr_state) */
const NRP=N.P={seat:-1,host:false,hostId:null,ids:[],names:[],cars:[],peers:new Map(),ice:null,q:[],last:{},raw:new Map(),st:new Map(),seq:0,o0:0,x0:0,timer:0,on:0};
const NRL=[-.667,0,.667],nrOff=(i,n)=>((Math.ceil(n/3)-1)-((i/3)|0))*900,nrOpen=P=>!!(P&&P.dc&&P.dc.readyState==='open');
function nrCarSet(c,a){c.rz=+a[2];c.rx=Math.max(-2.5,Math.min(2.5,a[3]/1000));c.rv=Math.max(0,+a[4]);c.ra=a[5]/100;c.rt=performance.now();c.got=1}
function nrApply(a){if(!Array.isArray(a)||a.length<6)return;const i=a[0]|0,n=+a[1];if(i===NRP.seat||i<0||i>=NRP.ids.length||!(n>(NRP.last[i]||0)))return;
 const v=a.slice(0,6).map(Number);if(!v.every(Number.isFinite))return;NRP.last[i]=n;NRP.raw.set(i,{a:v,t:Date.now()});const c=NRP.st.get(i);if(c)nrCarSet(c,v)}
N.mkCars=()=>{if(!NRP.on||NRP.seat<0)return null;NRP.st.clear();const n=NRP.ids.length,out=[];
 for(let i=0;i<n;i++){if(i===NRP.seat)continue;const v=VEH[NRP.cars[i]]||VEH[0],o=nrOff(i,n),x=NRL[i%3],
  c={net:1,seat:i,nm:NRP.names[i],o,z:PZ+o,x,tx:x,vx:0,spd:0,b:0,t:9,col:v.col,ty:v.ty,len:v.L,hw:v.hw,m:v.m,h:v.h,hp:1,spin:0,ang:0,sdir:1,kb:0,n:-1,q:0,pg:0,rz:PZ+o,rx:x,rv:0,ra:0,rt:0,got:0};
  const r=NRP.raw.get(i);if(r)nrCarSet(c,r.a);NRP.st.set(i,c);out.push(c)}
 return out};
window.__nrCar=(c,dt)=>{if(c.got){const age=(performance.now()-c.rt)/1000;if(age>3)c.rv*=Math.pow(.15,dt);
  const tz=c.rz+c.rv*Math.min(.4,age),ez=tz-c.z;c.spd+=(c.rv-c.spd)*Math.min(1,dt*8);if(Math.abs(ez)>9000)c.z=tz;else c.z+=c.spd*dt+ez*Math.min(1,dt*5);
  const x0=c.x;c.x+=(c.rx-c.x)*Math.min(1,dt*9);c.tx=c.rx;c.vx+=((c.x-x0)/Math.max(dt,1e-3)-c.vx)*Math.min(1,dt*8);c.ang=c.ra;c.spin=0;c.kb=0}
 c.pg=c.z-PZ-c.o};
window.__nrTag=(c,x,y,sc)=>{try{const T=VT[c.ty],w=sc*T[0]*U*HX;if(w<10*K)return;const hh=w*T[1]/T[0],fs=Math.max(9,Math.min(15,w*.14/K))*K,t=String(c.nm||'').slice(0,14);
 g.save();g.font='700 '+(fs|0)+'px Orbitron,system-ui,sans-serif';g.textAlign='center';const tw=g.measureText(t).width+fs*.9,ty=y-hh*1.1-fs*.8;
 g.fillStyle='rgba(11,2,33,.62)';g.fillRect(x-tw/2,ty-fs*.95,tw,fs*1.35);g.fillStyle=c.col;g.fillRect(x-tw/2,ty+fs*.3,tw,Math.max(1,fs*.1));g.fillStyle='#fff';g.fillText(t,x,ty);g.restore()}catch(e){}};
function nrPeer(sock,id,init){let P=NRP.peers.get(id);if(P)return P;if(typeof RTCPeerConnection!=='function')return null;let pc;try{pc=new RTCPeerConnection({iceServers:NRP.ice||[]})}catch(e){console.warn('[NR P2P] RTCPeerConnection',e);return null}
 P={pc,dc:null,rq:[]};NRP.peers.set(id,P);
 pc.onicecandidate=e=>{if(e.candidate)sock.emit('nr_signal',{to:id,candidate:e.candidate.toJSON?e.candidate.toJSON():e.candidate})};
 pc.onconnectionstatechange=()=>{const s=pc.connectionState;console.log('[NR P2P]',String(id).slice(0,6),s);if(s==='failed'||s==='closed'){if(NRP.peers.get(id)===P)NRP.peers.delete(id);try{pc.close()}catch(e){}}};
 const wire=dc=>{P.dc=dc;dc.onopen=()=>console.log('[NR P2P] canal aberto com',String(id).slice(0,6));dc.onmessage=e=>{try{const m=JSON.parse(e.data);if(m&&Array.isArray(m.s))m.s.forEach(nrApply)}catch(_){}}};
 if(init){wire(pc.createDataChannel('nr',{ordered:false,maxRetransmits:0}));
  pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>sock.emit('nr_signal',{to:id,sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}})).catch(e=>console.warn('[NR P2P] oferta',e))}
 else pc.ondatachannel=e=>wire(e.channel);
 return P}
function nrSig(sock,d){let P=NRP.peers.get(d.from);
 if(!P){if(NRP.host||d.from!==NRP.hostId||!d.sdp||d.sdp.type!=='offer')return;P=nrPeer(sock,d.from,false);if(!P)return}
 const pc=P.pc;
 if(d.sdp)pc.setRemoteDescription(d.sdp).then(()=>{P.rq.splice(0).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));
  if(d.sdp.type==='offer')return pc.createAnswer().then(a=>pc.setLocalDescription(a)).then(()=>sock.emit('nr_signal',{to:d.from,sdp:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}}))}).catch(e=>console.warn('[NR P2P] sdp',e));
 else if(d.candidate){if(pc.remoteDescription)pc.addIceCandidate(d.candidate).catch(()=>{});else P.rq.push(d.candidate)}}
function nrTick(sock){if(!NRP.on||NRP.seat<0||!(state>=1||fin>0))return;
 const me=[NRP.seat,++NRP.seq,Math.round(pos+PZ),Math.round(px*1000),Math.round(spd),Math.round((ang||0)*100)];
 if(!NRP.host){const P=NRP.peers.get(NRP.hostId);if(nrOpen(P)){try{P.dc.send(JSON.stringify({s:[me]}));return}catch(e){}}sock.emit('nr_state',{s:[me]});return}
 const now=Date.now(),arr=[me];NRP.raw.forEach(r=>{if(now-r.t<3000)arr.push(r.a)});const js=JSON.stringify({s:arr});let miss=0;
 NRP.ids.forEach((id,i)=>{if(i===NRP.seat)return;const P=NRP.peers.get(id);if(nrOpen(P)){try{P.dc.send(js)}catch(e){miss=1}}else miss=1});
 if(miss)sock.emit('nr_state',{s:arr})}
function nrStart(sock,m){const ps=Array.isArray(m&&m.players)?m.players:[];NRP.ids=ps.map(p=>p.id);NRP.names=ps.map(p=>String(p.name||''));NRP.cars=ps.map(p=>p.car|0);
 NRP.seat=NRP.ids.indexOf(sock.id);NRP.hostId=m.host;NRP.host=m.host===sock.id;N.seat=NRP.seat;if(NRP.seat<0)return;
 NRP.o0=nrOff(NRP.seat,ps.length);NRP.x0=NRL[NRP.seat%3];NRP.on=1;
 console.log('[NR P2P] corrida com',ps.length,'pilotos · lugar',NRP.seat,NRP.host?'(Host)':'');
 sock.emit('nr_turn',{});clearInterval(NRP.timer);NRP.timer=setInterval(()=>{try{nrTick(sock)}catch(e){}},83)}
NRP.stop=()=>{NRP.on=0;clearInterval(NRP.timer);setTimeout(()=>{NRP.peers.forEach(P=>{try{P.pc.close()}catch(e){}});NRP.peers.clear()},4000)};
addEventListener('pagehide',()=>{try{NRP.peers.forEach(P=>P.pc.close())}catch(e){}});
function nrP2P(sock){
 sock.on('match_start',m=>{try{nrStart(sock,m)}catch(e){console.error('[NR P2P] início',e)}});
 sock.on('nr_turn',d=>{NRP.ice=d&&Array.isArray(d.iceServers)&&d.iceServers.length?d.iceServers:[{urls:'stun:stun.l.google.com:19302'}];
  if(NRP.host)NRP.ids.forEach((id,i)=>{if(i!==NRP.seat)nrPeer(sock,id,true)});NRP.q.splice(0).forEach(x=>nrSig(sock,x))});
 sock.on('nr_signal',d=>{if(!d||!d.from)return;if(!NRP.ice){NRP.q.push(d);return}nrSig(sock,d)});
 sock.on('nr_state',d=>{if(d&&Array.isArray(d.s))d.s.forEach(nrApply)})}
// ---- room + start=1: liga ao servidor; cada piloto escolhe o veículo no menu original; o Host escolhe a pista.
function mp(){
  if(!window.io)return err('Não foi possível carregar o Socket.IO');
  const host=(Q.get('role')||'').trim().toLowerCase()==='host',code=(Q.get('room')||'').trim(),[,rTrk,rNP]=document.querySelectorAll('#ov .row'),ids=tid(),mapQ=Q.get('map');
  const sock=(window.GANet&&GANet.io||io)('https://gamer-fortune.onrender.com/neonrush',{path:'/ws',transports:['websocket','polling'],tryAllTransports:true,auth:{token:Q.get('token')}});
  let L=null,picked=false,tries=0;
  rNP.style.display='none';document.getElementById('sub').textContent='CORRIDA ONLINE';go.textContent='PRONTO';
  bar=el('div','net-panel','A ligar…');document.body.appendChild(bar);
  const setTrack=id=>{const i=ids.indexOf(id);if(i>=0&&i!==ki){loadTrack(i);setMusic(TRK[i].mu);info()}};
  if(host&&ids.includes(mapQ))setTrack(mapQ); // pista escolhida no setup vem pré-selecionada
  if(!host){rTrk.style.opacity=.4;rTrk.style.pointerEvents='none'} // convidado vê a pista do Host
  const join=()=>host?sock.emit('create_room',{code,players:+Q.get('players')||8,map:ids.includes(mapQ)?mapQ:undefined}):sock.emit('join_room',{code});
  const render=()=>{
    if(!L)return;bar.textContent='SALA '+L.code+' · '+L.players.length+'/'+L.max;
    if(!host&&L.track)setTrack(L.track);
    if(!picked){if(layer)layer.style.display='none';return}
    const all=L.players.length>1&&L.players.every(p=>p.car!=null);
    screen('<h2>SALA '+esc(L.code)+'</h2><p>'+esc((TRK[ids.indexOf(L.track||'metropole')]||TRK[ki]).n)+'</p><div>'+L.players.map(p=>{const v=VEH[p.car];return`<div class="net-row"><i class="net-dot" style="background:${v?v.col:'#556'}"></i>${esc(p.name)} — ${esc(v?v.nm:'a escolher…')}</div>`}).join('')+'</div>'
      +(host?'<button class="net-btn g" id="n-go"'+(all?'':' disabled')+'>COMEÇAR</button>':'<p>À espera do host…</p>')+'<button class="net-btn" id="n-back">TROCAR VEÍCULO</button>');
    const b=document.getElementById('n-go');if(b)b.onclick=()=>sock.emit('start_game',{});
    document.getElementById('n-back').onclick=()=>{picked=false;sock.emit('unpick',{});render()};
  };
  go.onclick=()=>{initA();sock.emit('pick',{car:ci,track:TRK[ki].mu});picked=true;render()};
  sock.on('race_update',u=>{try{const ps=(u&&u.players)||[];const lin=ps.map(p=>p.name+' · '+(p.status==='done'?ft(p.time):p.status==='dnf'?'DESISTIU':'a correr'));const t=document.getElementById('sub');if(t)t.textContent=lin.join('  ·  ')}catch(e){}});
  sock.on('game_over',g=>{const rk0=(g&&g.ranking)||[],me0=rk0.find(r=>r.seat===N.seat),nm0=[];rk0.forEach(r=>{nm0[r.seat]=r.name});try{N.P&&N.P.stop()}catch(e){}/*NR_P2P*/try{const w0=rk0[0]&&!rk0[0].dnf?rk0[0].seat:undefined;window.ga16Post&&window.ga16Post(Object.assign({},g,{winnerSeat:w0,names:nm0}),{mySeat:N.seat>=0?N.seat:undefined,players:rk0.length,names:nm0,outcome:me0?(me0.place===1&&!me0.dnf?'win':'loss'):undefined,game:'neonrush'})}catch(e){};try{const ranking=rk0;if(!ranking.length)return;const mine=me0||ranking[0];document.getElementById('ti').innerHTML=(mine.place===1?'VITORIA!':mine.place+'o LUGAR')+' · '+mine.name;const sub=ranking.map(r=>r.place+'o '+(r.dnf?'DNF':ft(r.time))+' · '+r.name).join('  |  ');const s=document.getElementById('sub');if(s)s.textContent=sub;const b=document.getElementById('go');if(b)b.textContent='CORRER DE NOVO';}catch(e){}});
  sock.on('connect',join);
  sock.on('connect_error',()=>{bar.textContent='Sem ligação ao servidor…'});
  sock.on('room_error',e=>{if(e.reason==='not_found'&&tries++<12)setTimeout(join,1500);else err('Erro na sala: '+e.reason)});
  sock.on('pick_error',()=>{picked=false;render();tst('Escolha inválida.')});
  sock.on('start_error',()=>tst('Todos têm de escolher o veículo primeiro.'));
  sock.on('lobby_state',s=>{L=s;render()});N.sock=sock;try{nrP2P(sock)}catch(e){console.error('[NR P2P]',e)}/*NR_P2P*/
  // Etapa 1: a corrida arranca em todos os aparelhos com a mesma pista, o mesmo percurso (semente) e o veículo de cada um.
  sock.on('match_start',m=>{if(layer)layer.style.display='none';bar.style.display='none';
    const r=(()=>{let a=m.seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let x=a;x=Math.imul(x^x>>>15,x|1);x^=x+Math.imul(x^x>>>7,x|61);return((x^x>>>14)>>>0)/4294967296}})();
    N.hid=[8,9,10,11];for(let i=3;i>0;i--){const j=r()*(i+1)|0;[N.hid[i],N.hid[j]]=[N.hid[j],N.hid[i]]} // mesmas etapas "premium" para todos
    NP=m.players.length;const i=ids.indexOf(m.track);if(i>=0)loadTrack(i);pickCar(m.car);info();
    setTimeout(()=>{ov.style.display='none';startRace()},50)});
  const d0=window.done;window.done=function(){d0();try{if(sock.connected)sock.emit('player_finished',{time:fin})}catch(e){}/*NR_P2P: antes nunca chegava ao servidor*/go.style.display='none';document.getElementById('sub').textContent+=' · REABRA PELO LAUNCHER'};
}
document.addEventListener('DOMContentLoaded',()=>mode==='setup'?setup():isMp?mp():err('Abra o jogo pelo Launcher'));
})();
