<html lang="pt"><head><meta charset="utf-8">

<title>Fruit Arena</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0c2a12;--fg:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c2a12}}
:root[data-theme="dark"]{--bg:#0c2a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:'Outfit','Trebuchet MS',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#bgc2{position:fixed;inset:0;width:100%;height:100%;display:block}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2.2vmin;padding:2vmin;background:radial-gradient(ellipse at 50% 30%,rgba(255,240,170,.3),rgba(20,70,20,.55) 70%),rgba(10,40,20,.3);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow:auto}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
#fr{display:flex;gap:1vmin;margin-bottom:-1vmin}
#fr canvas{width:clamp(34px,10vmin,56px);height:auto;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
#fr canvas:nth-child(2n){animation-delay:-.6s}#fr canvas:nth-child(3n){animation-delay:-1.2s}
@keyframes bob{50%{transform:translateY(-7px) rotate(4deg)}}
#logo{width:min(80vw,380px);filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
#th{display:grid;grid-template-columns:repeat(4,1fr);gap:2vmin;width:min(90vw,480px)}
#th canvas{width:100%;aspect-ratio:3/4;border-radius:14px;border:3px solid #f2c75c;box-shadow:0 4px 10px rgba(0,0,0,.4);cursor:pointer;transition:.2s;display:block}
#th canvas.on{border-color:#fff;box-shadow:0 0 0 3px #ffb81c,0 0 22px #ffd45a,0 6px 12px rgba(0,0,0,.45);transform:scale(1.08) translateY(-2px)}
#np{display:flex;gap:2.4vmin}
.n{display:flex;align-items:center;padding:9px 14px;border-radius:40px;border:3px solid #7a4a1a;background:linear-gradient(#e8a850,#b8742c);box-shadow:0 4px 0 #6a3c12,0 8px 12px rgba(0,0,0,.35);cursor:pointer;transition:.15s}
.n canvas{width:clamp(22px,6.4vmin,34px);height:auto;margin-left:-6px}.n canvas:first-child{margin-left:0}
.n.on{background:linear-gradient(#fff3a0,#ffc02a);border-color:#fff;transform:translateY(-3px) scale(1.06);box-shadow:0 4px 0 #b87a10,0 0 20px #ffd45a}
#go{width:clamp(76px,20vmin,104px);aspect-ratio:1;border-radius:50%;border:5px solid #fff3b0;background:radial-gradient(circle at 35% 28%,#e6ff8a,#58cc3a 55%,#1f8a22);box-shadow:0 6px 0 #146a18,0 0 30px rgba(140,255,80,.65);cursor:pointer;position:relative;animation:pul 1.6s ease-in-out infinite}
#go::after{content:"";position:absolute;left:37%;top:27%;border-left:30px solid #fff;border-top:20px solid transparent;border-bottom:20px solid transparent;filter:drop-shadow(0 2px 2px rgba(0,60,0,.5))}
@keyframes pul{50%{transform:scale(1.07)}}
#spl{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#2d6a22,#0c2a12 75%);color:#fff;transition:opacity .6s}
#spl.out{opacity:0;pointer-events:none}
#spl::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(4,16,8,.72) 100%)}
#splbg{position:absolute;inset:0;width:100%;height:100%}
#splc{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3.2vmin;padding:5vmin 0;width:min(90vw,440px);background:radial-gradient(ellipse at 50% 50%,rgba(8,24,12,.6),rgba(8,24,12,0) 72%)}
.sfr{display:flex;gap:1vmin}
.sfr canvas{width:clamp(34px,10vmin,56px);height:auto;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35))}
.sfr canvas:nth-child(2n){animation-delay:-.6s}.sfr canvas:nth-child(3n){animation-delay:-1.2s}
.slogo svg{width:min(80vw,380px);filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.sbar{width:min(72vw,320px);height:20px;border-radius:12px;border:3px solid #7a4a1a;background:#2a1606;box-shadow:0 4px 0 #6a3c12,0 8px 12px rgba(0,0,0,.4);overflow:hidden}
.sbar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(#e6ff8a,#58cc3a 55%,#1f8a22);box-shadow:0 0 14px rgba(140,255,80,.7);animation:ld 5s linear forwards}
@keyframes ld{to{width:100%}}
.stx{font-weight:900;font-size:clamp(16px,4.4vmin,24px);text-shadow:0 2px 0 rgba(0,0,0,.5);animation:pul 1.6s ease-in-out infinite}
#net{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:3vmin;padding:6vmin;text-align:center;background:radial-gradient(ellipse at 50% 30%,rgba(255,240,170,.28),rgba(12,42,18,.96) 72%);font-weight:900;font-size:clamp(18px,5vmin,28px);text-shadow:0 2px 0 rgba(0,0,0,.5)}
#net small{display:block;margin-top:1vmin;font-size:.62em;font-weight:700;opacity:.85}
#net button{padding:9px 22px;border-radius:40px;border:3px solid #7a4a1a;background:linear-gradient(#e8a850,#b8742c);box-shadow:0 4px 0 #6a3c12,0 8px 12px rgba(0,0,0,.35);color:#fff;font:900 clamp(15px,4vmin,22px) 'Outfit','Trebuchet MS',system-ui,sans-serif;cursor:pointer}
#tb{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 2.5vmin);transform:translateX(-50%);z-index:10;display:none;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;padding:1.2vmin 4.4vmin;border-radius:40px;font-weight:900;font-size:clamp(14px,3.8vmin,22px)}
#tb.me{background:linear-gradient(#9cff72,#35b92f);border:3px solid #fff3b0;box-shadow:0 4px 0 #146a18,0 0 22px rgba(140,255,80,.65);color:#0c3a10}
#tb.ot{background:rgba(6,16,10,.74);border:2px solid rgba(255,255,255,.28);color:#fff}
/* ================= UI PREMIUM ================= */
:root{--ff:'Outfit','Trebuchet MS',system-ui,sans-serif}
#ov{z-index:8}
.stx,#net,#tb,#toast,#hud{font-family:var(--ff)}
#go{transition:transform .16s cubic-bezier(.3,1.5,.5,1),box-shadow .2s,filter .2s;will-change:transform}
@media (hover:hover){#go:hover{animation:none;transform:scale(1.08);filter:brightness(1.07)}}
#go:active{animation:none;transform:scale(.9);filter:brightness(.94)}
#go.setup{background:radial-gradient(circle at 32% 24%,rgba(255,255,255,.6),rgba(255,255,255,0) 36%),linear-gradient(150deg,#94e6ff 0%,#3ea4ff 38%,#2a5cff 70%,#1b2fb5 100%);border-color:#e6f5ff;box-shadow:0 6px 0 #14298c,0 12px 24px rgba(10,30,120,.45),0 0 34px rgba(90,170,255,.75),inset 0 -6px 12px rgba(10,20,120,.35)}
#go.setup:active{box-shadow:0 2px 0 #14298c,0 4px 12px rgba(10,30,120,.4),0 0 22px rgba(90,170,255,.6),inset 0 -4px 10px rgba(10,20,120,.35)}
#go.setup::after{filter:drop-shadow(0 2px 2px rgba(0,20,90,.6))}
#go.ok{animation:okp .65s ease-out}
@keyframes okp{0%{box-shadow:0 0 0 0 rgba(150,220,255,.95),0 6px 0 #14298c}100%{box-shadow:0 0 0 28px rgba(150,220,255,0),0 6px 0 #14298c}}
/* HUD em vidro */
#hud{position:fixed;left:0;top:0;width:360px;height:720px;transform-origin:0 0;pointer-events:none;z-index:6;transition:opacity .45s ease}
#hud.off{opacity:0!important}
#hud .hbar{position:absolute;left:0;right:0;top:0;padding:22px 12px 0;display:flex;flex-direction:column;gap:8px}#hud .hrow{display:flex;gap:12px}
.pc .hb{height:8px;border-radius:5px}.pc .hb i{border-radius:5px}.pc .inf{gap:3px}
.hb.b2 .fl{background:linear-gradient(180deg,#fff 0,#ffe27a 40%,#ff9f1a 100%);box-shadow:0 0 10px #ffb52e}
.pc.brk{animation:brk .9s ease-out}@keyframes brk{0%{filter:brightness(3) saturate(2);transform:scale(1.12) rotate(-2deg)}30%{transform:scale(.94) rotate(2deg)}100%{filter:none;transform:none}}
.cbn{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font:900 34px/1 system-ui,sans-serif;letter-spacing:1px;white-space:nowrap;pointer-events:none;z-index:7;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px currentColor;animation:cbn 1.15s cubic-bezier(.2,1.4,.3,1) forwards}
.cbn small{display:block;font-size:12px;letter-spacing:3px;opacity:.9;text-align:center;margin-top:4px}
.cbn.t1{color:#fff7b0;font-size:26px}.cbn.t2{color:#ffd23c;font-size:32px}.cbn.t3{color:#ff7a2e;font-size:34px}.cbn.sm{font-size:21px!important}
.cbn.t4{font-size:38px;background:linear-gradient(90deg,#ff4d6d,#ffd23c,#5dff8f,#4dc6ff,#c45dff,#ff4d6d);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 12px #fff) drop-shadow(0 4px 0 rgba(0,0,0,.5));animation:cbn 1.3s cubic-bezier(.2,1.4,.3,1) forwards,rbw .5s linear infinite}
@keyframes cbn{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-12deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}32%{transform:translate(-50%,-50%) scale(1) rotate(-1deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1.1)}}
@keyframes rbw{to{background-position:300% 0}}
#fxf{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:8;mix-blend-mode:screen;background:radial-gradient(circle,#fff 0,var(--fc,#fff) 45%,transparent 100%)}#fxf.on{animation:fxf .55s ease-out}@keyframes fxf{0%{opacity:.95}100%{opacity:0}}
#hud.sh{animation:hsh .45s cubic-bezier(.36,.07,.19,.97)}
#cv.sh{animation:csh .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes hsh{0%,100%{translate:0 0}15%{translate:-5px 2px}30%{translate:5px -2px}45%{translate:-4px -1px}60%{translate:3px 2px}80%{translate:-2px 0}}
@keyframes csh{0%,100%{transform:none}15%{transform:translate(-5px,2px)}30%{transform:translate(5px,-2px)}45%{transform:translate(-4px,-1px)}60%{transform:translate(3px,2px)}80%{transform:translate(-2px,0)}}
.pc{position:relative;flex:1 1 0;min-width:0;height:48px;box-sizing:border-box;padding:0 6px;display:flex;align-items:center;gap:8px;border-radius:17px;color:#fff;
background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.07) 58%,rgba(255,255,255,.13));border:1px solid rgba(255,255,255,.4);
box-shadow:0 8px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 0 rgba(0,0,0,.12);
-webkit-backdrop-filter:blur(12px) saturate(165%);backdrop-filter:blur(12px) saturate(165%);transition:opacity .4s,filter .4s,border-color .3s}
.pc.R{flex-direction:row-reverse}
.pc .av{position:relative;flex:0 0 40px;height:40px}
.pc .av canvas{position:absolute;left:-16px;top:-16px;width:72px;height:72px}
.pc .av.fl canvas{animation:avf .44s ease-out}
@keyframes avf{0%{filter:brightness(2.8) saturate(.3)}100%{filter:none}}
.pc.stk .av canvas{filter:drop-shadow(0 0 5px rgba(255,210,90,.95))}
.pc .rg{position:absolute;left:-12px;top:-12px;width:64px;height:64px;transform:rotate(-90deg);opacity:0;transition:opacity .25s;overflow:visible}
.pc.clk .rg{opacity:1}
.rg circle{fill:none;stroke:#fff6b0;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:0;filter:drop-shadow(0 0 3px rgba(255,240,150,.9))}
.pc.low .rg circle{stroke:#ff4d4d;filter:drop-shadow(0 0 5px #ff2a2a);animation:lowp .5s ease-in-out infinite alternate}
@keyframes lowp{to{stroke:#ffb4b4}}
.pc .tg{position:absolute;left:-15px;top:-15px;width:70px;height:70px;box-sizing:border-box;border-radius:50%;border:2px dashed rgba(255,70,90,.95);box-shadow:0 0 12px rgba(255,50,70,.6),inset 0 0 8px rgba(255,50,70,.3);opacity:0;transition:opacity .2s;animation:spin 3.2s linear infinite}
.pc.tgt .tg{opacity:1}
@keyframes spin{to{transform:rotate(360deg)}}
.pc .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pc .nm{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:10.5px;line-height:1.05;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.pc.R .nm{flex-direction:row-reverse}
.pc .nm b{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;letter-spacing:.2px}
.pc .nm span{font-weight:700;font-size:9px;opacity:.88;font-variant-numeric:tabular-nums}
.hb{position:relative;height:11px;border-radius:7px;overflow:hidden;background:rgba(5,12,28,.55);box-shadow:inset 0 1px 3px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.3)}
.hb i{position:absolute;top:0;bottom:0;left:0;width:100%;border-radius:7px}
.pc.R .hb i{left:auto;right:0}
.hb .gh{background:linear-gradient(#fff,#ffd2d2);opacity:.8;transition:width .9s cubic-bezier(.3,0,.2,1) .35s}
.hb .fl{background:linear-gradient(180deg,rgba(255,255,255,.95) 0,var(--c) 40%,var(--c2) 100%);box-shadow:0 0 10px var(--c);transition:width .3s ease-out}
.hb .fl::after{content:"";position:absolute;left:4px;right:4px;top:2px;height:2px;border-radius:2px;background:rgba(255,255,255,.55)}
.hb::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(16.666% - 1px),rgba(0,0,0,.3) calc(16.666% - 1px),rgba(0,0,0,.3) 16.666%)}
.pc.act{border-color:rgba(255,255,255,.8);animation:actp 1.5s ease-in-out infinite}
@keyframes actp{0%,100%{box-shadow:0 0 0 1.5px var(--c),0 0 12px var(--c2),0 8px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.6)}50%{box-shadow:0 0 0 2px var(--c),0 0 26px var(--c),0 8px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.6)}}
.pc.hit{animation:pshk .45s cubic-bezier(.36,.07,.19,.97)}
.pc.act.hit{animation:actp 1.5s ease-in-out infinite,pshk .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes pshk{0%,100%{transform:none}12%{transform:translate(-3px,0)}25%{transform:translate(3px,1px)}38%{transform:translate(-3px,-1px)}52%{transform:translate(2px,0)}70%{transform:translate(-1px,0)}}
.pc.dead{filter:grayscale(1) brightness(.75);opacity:.55}
.dmg{position:absolute;font:900 17px/1 var(--ff);color:#fff;-webkit-text-stroke:3px #c8102e;paint-order:stroke fill;text-shadow:0 2px 0 #5a0010,0 0 10px rgba(255,60,80,.85);pointer-events:none;white-space:nowrap;animation:dmgp 1.1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes dmgp{0%{opacity:0;transform:translate(-50%,-30%) scale(.5)}18%{opacity:1;transform:translate(-50%,-80%) scale(1.25)}35%{transform:translate(-50%,-90%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
/* flash vermelho nas bordas de quem recebe dano */
#vig{position:fixed;inset:0;pointer-events:none;z-index:7;opacity:0;background:radial-gradient(ellipse at 50% 48%,rgba(255,0,40,0) 42%,rgba(255,20,60,.36) 72%,rgba(190,0,30,.8) 100%);box-shadow:inset 0 0 70px 18px rgba(255,0,40,.55)}
#vig.on{animation:vig .78s ease-out}
@keyframes vig{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
/* avisos de turno com fade */
#tb{display:block;opacity:0;transform:translate(-50%,16px) scale(.92);transition:opacity .3s ease,transform .38s cubic-bezier(.2,1.3,.4,1);font-weight:800;letter-spacing:.2px;-webkit-backdrop-filter:blur(10px) saturate(150%);backdrop-filter:blur(10px) saturate(150%)}
#tb.show{opacity:1;transform:translate(-50%,0) scale(1)}
#tb.me{background:linear-gradient(180deg,#bcff95 0%,#52d641 55%,#2aa52a 100%);border:2px solid #f4ffd2;color:#0b3a0f;text-shadow:0 1px 0 rgba(255,255,255,.45);animation:tbg 1.4s ease-in-out infinite}
@keyframes tbg{0%,100%{box-shadow:0 4px 0 #146a18,0 0 12px rgba(120,255,90,.5)}50%{box-shadow:0 4px 0 #146a18,0 0 32px 7px rgba(140,255,90,.95)}}
#tb.ot{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.06)),rgba(8,20,14,.55);border:1px solid rgba(255,255,255,.38);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
#tb.wt{background:linear-gradient(180deg,rgba(160,210,255,.24),rgba(160,210,255,.06)),rgba(8,16,32,.6);border:1px solid rgba(170,215,255,.5);color:#e8f4ff;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.sp{display:inline-block;width:.8em;height:.8em;margin-right:.55em;vertical-align:-.06em;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
/* overlay de rede em vidro */
#net .nc{display:flex;flex-direction:column;align-items:center;gap:2.4vmin;padding:5vmin 7vmin;border-radius:26px;max-width:84vw;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.36);box-shadow:0 18px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5);-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);animation:ncin .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes ncin{from{opacity:0;transform:translateY(10px) scale(.95)}}
#net .nt{font-weight:800}
#net .spin{width:46px;height:46px;box-sizing:border-box;border-radius:50%;border:4px solid rgba(255,255,255,.18);border-top-color:#9cff72;border-right-color:#9cff72;animation:spin .9s linear infinite;filter:drop-shadow(0 0 8px rgba(140,255,90,.6))}
#net .ni{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:30px;color:#fff;background:linear-gradient(#ff8080,#d0203a);box-shadow:0 0 18px rgba(255,60,80,.6)}
#net button{font-family:var(--ff);transition:transform .15s}
#net button:active{transform:scale(.93)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 4vmin);z-index:60;transform:translate(-50%,-14px);opacity:0;pointer-events:none;padding:1.4vmin 4.4vmin;border-radius:40px;font-weight:800;font-size:clamp(13px,3.6vmin,18px);line-height:1.2;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.08)),rgba(10,30,60,.55);border:1px solid rgba(255,255,255,.4);box-shadow:0 10px 24px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:opacity .3s,transform .35s cubic-bezier(.2,1.3,.4,1);white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.pc.act,#tb.me,.pc .tg{animation:none}}

/* ================= VISUAL PREMIUM 4K ================= */
#cv{image-rendering:auto}
#bgc2{animation:kbz 26s ease-in-out infinite alternate;transform-origin:50% 45%;will-change:transform}
@keyframes kbz{0%{transform:scale(1.06) translate3d(-.6%,.4%,0)}100%{transform:scale(1.13) translate3d(.6%,-.6%,0)}}
/* banners de combo cinematográficos */

 if(N.started){mpLock=true;showNet('Ligação perdida','A reconectar…')}else showNet('A ligar à sala…','Ligação perdida. A tentar novamente…');
 if(reason==='io server disconnect')setTimeout(()=>{try{N.sock&&!N.done&&N.sock.connect()}catch(e){}},1000)}
function mpOnConnErr(){const N=NET;N.errs++;if(N.done)return;
 if(!N.started)showNet('A ligar à sala…',N.errs>=2?'O servidor está a acordar — pode demorar até 1 minuto…':'A ligar ao servidor…')}
function mpTick(){const N=NET,n=Date.now(),s=N.sock;if(N.fatal||N.done)return;
 if(!N.started){if(s&&s.connected&&n-N.joinAt>=3000)mpJoin();
  if(!N.everConnected&&n-N.bootAt>90000)mpFatal('Sem ligação ao servidor.','Verifica a internet e tenta de novo.');return}
 if(N.discAt&&n-N.discAt>60000){mpFatal('Ligação perdida com o servidor.');return}
 if(N.syncing&&s&&s.connected&&n-N.joinAt>=4000)mpJoin();
 if(N.out&&N.out.length&&s&&s.connected&&n-N.out[0].at>1200){mpFlush(true);if(n-N.joinAt>9000)mpJoin()}
 if(!N.gotState&&N.startAt&&n-N.startAt>4000)mpLock=false}

function mpFindMe(seats){const id=NET.sock&&NET.sock.id;let q=id&&seats.find(s=>s&&(s.sid===id||s.socketId===id||s.id===id));
 if(!q&&NET.token)q=seats.find(s=>s&&s.token&&s.token===NET.token);
 if(!q&&NET.role=='host')q=seats.find(s=>s&&(s.host===true||s.role=='host'))||seats.find(s=>s&&+s.seat===0);
 if(!q&&NET.role=='guest'&&seats.length==2)q=seats.find(s=>s&&+s.seat!==0&&!(s.host===true||s.role=='host'));
 return q&&Number.isInteger(+q.seat)?+q.seat:null}

function mpOnMatchStart(m){const N=NET;if(N.fatal||N.done||!m||!Array.isArray(m.seats)||!m.seats.length)return;
 const me=mpFindMe(m.seats);
 if(N.started){N.seats=m.seats;if(me!=null&&me!==mySeat)console.warn('[Fruit Arena] servidor indicou outro lugar:',me,'≠',mySeat);return}
 if(me==null){mpFatal('Não foi possível identificar o teu lugar na sala.');return}
 N.seats=m.seats;mySeat=me;N.seed=(nSeed(m.seed)>>>0)||1;
 NP=Math.max(2,Math.min(4,+m.players||m.seats.length));layout();
 MASK=MASKS[((m.mask|0)%MASKS.length+MASKS.length)%MASKS.length];setScene(((m.scenario|0)%SCN.length+SCN.length)%SCN.length);
 FT=mpFT(N.seed);mkBoard();mkSign();
 P=Array.from({length:NP},(_,i)=>({hp:HPT,hv:HPT,alive:true,bot:i>0,ch:0,fl:0,sk:0,kb:0,streak:0}));
 pt=[];cm=[];dy=[];ps=[];shown=0;ga=1;win=-1;shk=0;zm=0;hurt=0;elim=[];rank=[];pz=[];fw=0;prizeT=0;htgt=1;lastSw=[];sel=null;drag=null;hint=null;phs='idle';ST5=[];REC5=rec5New();
 N.started=true;N.startAt=Date.now();N.turnSeat=-1;N.boardSeed=null;N.pend=null;N.first=true;
 turn=0;tgt=1;timer=TT;mpBoard(mixSeed(N.seed,mySeat));N.aid=0;N.out=[];st='aim';run=true;mpLock=true;
 hideNet();try{musicMode('game')}catch(e){}mpBanner();
 if(N.queue){const g=N.queue;N.queue=null;mpOnState(g)}}

function mpOnState(g){const N=NET;if(N.fatal||N.done||N.over||!g)return;
 if(!N.started){N.queue=g;return}
 const firstEver=!N.gotState,quiet=N.first;N.gotState=true;N.first=false;
 if(+g.maxHealth>0)N.hpMax=+g.maxHealth;
 const ph=Array.isArray(g.playersHealth)?g.playersHealth.map(v=>Math.max(0,+v||0)):null;
 // 1) vida: só o servidor altera as barras
 if(ph)for(let s=0;s<NP&&s<ph.length;s++){const l=s2l(s),p=P[l];if(!p)continue;
  const v=HPT*Math.min(N.hpMax,ph[s])/N.hpMax;
  if(v<p.hp-1e-6){if(quiet){p.hp=v;p.hv=v}else hitAt(l,(p.hp-v)*100)}
  p.hp=v;if(quiet)p.hv=v;
  if(ph[s]<=0&&p.alive){if(quiet){p.alive=false;elim.push(l)}else kill(l)}
  else if(ph[s]>0&&!p.alive){p.alive=true;elim=elim.filter(i=>i!==l)}}
 mpLock=false;N.syncing=false;N.discAt=0;hideNet();
 // 2) vitória: NUNCA calculada aqui — só o evento game_over do servidor termina a partida
 // 3) tempo real: sem turnos. O servidor confirma os meus ataques (acks) e mostra os dos outros (hit)
 if(g.acks&&N.out)N.out=N.out.filter(a=>a.id>(+g.acks[mySeat]||0));
 if(N.reconnected){N.reconnected=false;mpFlush(true)}
 if(P[0]&&!P[0].alive&&st=='aim')st='remote';
 if(firstEver)cbn('LUTA!',3);
 if(g.hit&&!quiet)mpRemoteHit(g.hit);
 mpBanner()}

// fim da jogada: ataca JÁ (sem esperar ninguém) e fica logo livre para jogar outra vez
function mpAfterMove(){const N=NET;if(N.done||st=='end'||st=='prize')return;
 mpAttack(turnDmg+mpUlt,{chain:maxChain,tier:moveTier});
 chain=0;turnItems=0;turnSp=0;turnDmg=0;mpUlt=0;maxChain=0;moveTier=0;lastTier=0;surge=null;
 sel=null;drag=null;hint=null;idleT=0;timer=TT;st=P[0]&&P[0].alive?'aim':'remote';mpBanner()}
function mpAttack(dmg,c){const N=NET;if(N.done||N.over||!P[0]||!P[0].alive||!N.out)return;
 let t=tgt;if(!P[t]||!P[t].alive||t===0)t=nxt(0);
 const a={code:N.room,seat:mySeat,id:N.aid+1,damage:Math.max(0,Math.round(dmg)),targetSeat:l2s(t),chain:c.chain|0,tier:c.tier|0,ult:c.ult?1:0,at:0};
 if(a.damage<=0)return;N.aid++;N.out.push(a);mpFlush(false)}
function mpFlush(all){const N=NET,s=N.sock;if(!s||!s.connected||!N.out)return;(all?N.out:N.out.slice(-1)).forEach(a=>{a.at=Date.now();s.emit('attack',a)})}
// efeitos dos ataques dos OUTROS jogadores no meu ecrã (projéteis até à vítima + combos grandes)
function mpRemoteHit(h){const f=s2l(h.from),t=s2l(h.to);if(h.from===mySeat||!POS[f]||!POS[t])return;const[x0,y0]=POS[f],[tx,ty]=POS[t],c=TH[slotFruit(f)].c,tr=h.tier|0;
 for(let i=0;i<Math.min(12,3+tr*3);i++)cm.push({x0,y0,tx,ty,v:0,dl:i*.04,t:.45,d:t,tr:[],rgb:c,sd:Math.random()*2-1,z:1+tr*.3});
 if(tr>=2)comboFX(tr,f,h.chain|0)}
function mpTimeout(){}

// fim de jogo: decidido SÓ pelo servidor (game_over). O cliente nunca calcula o vencedor.
function mpOnOver(g){const N=NET;if(N.fatal||N.done||N.over||!g)return;
 if(Array.isArray(g.playersHealth))mpOnState({playersHealth:g.playersHealth,maxHealth:g.maxHealth,currentTurnSeat:-1});
 N.over=true;const ws=Number.isInteger(+g.winnerSeat)&&+g.winnerSeat>=0&&+g.winnerSeat<NP?+g.winnerSeat:-1;NET.ga16Ws=ws;/*GA16_FRUIT*/ga16FruitEnd(ws);/*GA16_UNIFY*/
 if(Array.isArray(g.ranking)&&g.ranking.length>1)elim=g.ranking.slice(1).reverse().map(s2l);
 N.pend=null;mpLock=true;tbShow('');setTimeout(()=>mpFinish(ws),ws<0?0:700)}
/*GA16_UNIFY: fim → popup premium + report único via window.ga16Post (ga16-post.js v3)*/
function ga16FruitEnd(ws,why){try{var nms=[];for(var k=0;k<NP;k++)nms.push(mpName(k));window.ga16Post&&window.ga16Post({winnerSeat:ws,draw:ws<0&&why!=='closed',reason:why||''},{mySeat:mySeat,names:nms,players:NP,outcome:why==='closed'?'closed':undefined,game:'fruit'})}catch(e){console.error('[Fruit Arena] ga16Post:',e)}}
function mpFinish(ws){const N=NET;if(N.done)return;const w=ws<0?-1:s2l(ws);
 P.forEach((p,i)=>{if(i!==w&&p.alive){p.alive=false;if(!elim.includes(i))elim.push(i)}});
 N.pend=null;mpLock=false;cm=[];phs='idle';sel=null;drag=null;hint=null;win=w;hideNet();tbShow('');fin()}

// ---------- arranque ----------
layout();fit();init();requestAnimationFrame(loop);
if(MP||MODE=='training')addEventListener('pointerdown',()=>{try{ac();AC&&AC.resume&&AC.resume();if(run&&MU.mode!='game'&&st!='end'&&st!='prize')musicMode('game')}catch(e){}});
if(MODE=='setup')setupBoot();else if(MODE=='training')trainingBoot();else if(MP)mpBoot();
try{document.fonts&&document.fonts.load("900 40px 'Outfit'").then(()=>{try{sprites();menuIcons()}catch(e){}}).catch(()=>{})}catch(e){}
(()=>{const dp=devicePixelRatio||1,sp=$('spl');try{const W=Math.min(Math.round(innerWidth*dp),720),H=Math.min(Math.round(innerHeight*dp),1280),e=$('splbg');e.width=W;e.height=H;SCN[scn%SCN.length](e.getContext('2d'),W,H);try{grade(e.getContext('2d'),W,H,scn)}catch(_){}}catch(_){}
 try{const f=sp.querySelector('.sfr');for(let i=0;i<6;i++){const c=document.createElement('canvas');c.width=c.height=112;c.getContext('2d').drawImage(FR[i],0,0,112,112);f.append(c)}}catch(_){}
 try{sp.querySelector('.slogo').innerHTML=$('logo').outerHTML.replace(/\bg([12])\b/g,'sg$1').replace('id="logo"','')}catch(_){}
 try{if(MP)sp.querySelector('.stx').textContent='A ligar à sala…'}catch(_){}
 setTimeout(()=>{sp.classList.add('out');setTimeout(()=>sp.remove(),700);if(MODE=='training')trainingStart()},MP?1200:5000)})();
