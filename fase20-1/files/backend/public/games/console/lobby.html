<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arena Console · Sala</title>
<style>
:root{--bg:#010E1F;--card:#0b1a33;--neon:#3dffa8;--cy:#05d9e8;--pk:#ff2a6d;--tx:#fff;--tx2:#a8b9e8;--mut:#6c7ea8}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(120% 60% at 50% 0%,#0f2a55,var(--bg) 60%);color:var(--tx);font:500 14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 22px)}
h1{margin:4px 0 0;font:900 22px/1 system-ui;letter-spacing:.06em}h1 b{color:var(--neon)}
.card{width:min(100%,440px);padding:16px;border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid rgba(61,255,168,.22);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.rom{display:flex;gap:12px;align-items:center}.rom i{font-style:normal;font-size:30px}.rom b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}.rom small{color:var(--tx2);font-size:12px}
.lbl{color:var(--mut);font:800 10px system-ui;letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
button{font:900 14px system-ui;letter-spacing:.08em;border:0;border-radius:999px;padding:14px 20px;color:#04121f;background:var(--neon);box-shadow:0 6px 18px rgba(61,255,168,.3);cursor:pointer;width:100%}
button.ghost{background:transparent;color:var(--tx);border:1px solid rgba(255,255,255,.3);box-shadow:none}button.cy{background:var(--cy)}button:disabled{opacity:.35;box-shadow:none}
.row{display:flex;gap:10px}.row>*{flex:1}
input{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.3);color:#fff;font:900 22px system-ui;letter-spacing:.35em;text-align:center;text-transform:uppercase;outline:none}
input:focus{border-color:var(--neon)}
.code{font:900 40px/1 system-ui;letter-spacing:.28em;text-align:center;color:var(--neon);text-shadow:0 0 18px rgba(61,255,168,.45);margin:4px 0 12px}
.pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.25);margin-top:8px}
.pl .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:#1a2a55;border:2px solid rgba(255,255,255,.25)}
.pl.me .av{background:#0e5a3d}.pl .tx{flex:1;min-width:0}.pl .tx b{display:block}.pl .tx small{color:var(--tx2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font:800 10px system-ui;letter-spacing:.1em;padding:4px 9px;border-radius:999px;border:1px solid var(--mut);color:var(--mut)}.pill.ok{border-color:var(--neon);color:var(--neon)}
.pl.empty{opacity:.55}.pl.empty .av{border-style:dashed}
.note{padding:10px 12px;border-radius:12px;font-size:12px;text-align:center;margin-top:12px}.note.ok{background:rgba(61,255,168,.12);color:var(--neon)}.note.bad{background:rgba(255,42,109,.14);color:#ff8fae}
.big{font-size:48px;text-align:center}.msg{color:var(--tx2);text-align:center;line-height:1.4}
.hide{display:none!important}.err{color:#ff8fae;text-align:center;font-size:13px;min-height:18px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--neon);animation:sp 1s linear infinite;margin:6px auto}@keyframes sp{to{transform:rotate(360deg)}}
</style>
<script defer src="/ws/socket.io.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.socket.io/4.7.5/socket.io.min.js';document.head.appendChild(s)"></script>
</head><body><main>
<h1>ARENA <b>CONSOLE</b></h1>
<div class="card rom"><i>💿</i><div><b id="romName">—</b><small id="romInfo"></small></div></div>

<section id="sChoose" class="card hide">
  <div class="lbl">Joga online 1x1</div>
  <button id="bCreate">CRIAR SALA</button>
  <div class="lbl" style="margin-top:16px">Ou entra na sala de um amigo</div>
  <input id="iCode" maxlength="6" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <div style="height:10px"></div>
  <button id="bJoin" class="cy">ENTRAR</button>
  <p class="err" id="eChoose"></p>
</section>

<section id="sLobby" class="card hide">
  <div class="lbl">Código da sala</div>
  <div class="code" id="tCode">——</div>
  <div class="row"><button id="bShare" class="ghost">PARTILHAR</button><button id="bCopy" class="ghost">COPIAR</button></div>
  <div class="lbl" style="margin-top:16px">Jogadores</div>
  <div id="players"></div>
  <div id="romNote" class="note hide"></div>
  <div style="height:14px"></div>
  <button id="bReady">ESTOU PRONTO</button>
  <div style="height:10px"></div>
  <button id="bStart" class="cy hide" disabled>INICIAR PARTIDA</button>
  <p class="err" id="eLobby"></p>
</section>

<section id="sGo" class="card hide">
  <div class="big">🎮</div>
  <div class="spin" id="goSpin"></div>
  <p class="msg" id="goMsg">A abrir o Arena Console…</p>
  <button id="bRetry" class="hide">TENTAR OUTRA VEZ</button>
</section>

<section id="sInfo" class="card hide"><div class="big">😿</div><p class="msg" id="infoMsg"></p></section>

<button id="bLeave" class="ghost" style="width:min(100%,440px)">SAIR</button>
</main>
<script>
(function(){
'use strict';
var $=function(i){return document.getElementById(i)};
var A=window.AndroidInterface||null,L={},sock=null,state=null,ready=false,lastStart=null,pending=null;
try{L=A&&A.getLaunch?JSON.parse(A.getLaunch()||'{}'):{}}catch(e){L={}}
var Q=new URLSearchParams(location.search);
if(!L.rom&&Q.get('demo')==='1')L={token:'',rom:{name:'Demo PSP',size:734003200,fp:'0123456789abcdef0123456789abcdef',gid:'ULES00000'}}; // só para testar num browser
var R=L.rom||null;
function human(b){return b>=1073741824?(b/1073741824).toFixed(2)+' GB':(b/1048576).toFixed(0)+' MB'}
function show(id){['sChoose','sLobby','sGo','sInfo'].forEach(function(s){$(s).classList.toggle('hide',s!==id)})}
function info(m){$('infoMsg').textContent=m;show('sInfo')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';'})}
var ERR={bad_code:'Código inválido.',exists:'Essa sala já existe. Tenta outra vez.',not_found:'Sala não encontrada. Confirma o código.',full:'A sala já está cheia.',started:'A partida já começou.',bad_rom:'O jogo não é válido. Volta a carregá-lo.',not_host:'Só o anfitrião pode iniciar.',need_2:'Falta o segundo jogador.',not_ready:'Os dois jogadores têm de estar prontos.',rom_mismatch:'Os dois jogadores têm de usar a mesma ISO.'};
if(!R){info('Não foi possível ler o jogo escolhido. Volta atrás e escolhe-o outra vez.')}
else{
  $('romName').textContent=R.name;$('romInfo').textContent=human(R.size)+(R.gid?' · '+R.gid:'');
  show('sChoose');
}
function connect(cb){
  if(sock){if(sock.connected)cb();else pending=cb;return}
  var IO=(window.GANet&&GANet.io)||window.io;
  if(!IO){$('eChoose').textContent='Não foi possível ligar ao servidor. Tenta outra vez.';return}
  pending=cb;
  sock=IO(location.origin+'/console',{path:'/ws',transports:['websocket','polling'],auth:{token:L.token||''}});
  sock.on('connect',function(){$('eChoose').textContent='';var f=pending;pending=null;if(f)f();else if(state)rejoin()});
  sock.on('connect_error',function(){$('eChoose').textContent='Sem ligação ao servidor… a tentar outra vez.'});
  sock.on('room_error',function(e){var m=ERR[e&&e.reason]||'Erro na sala.';if(e&&e.reason==='exists'&&state&&state.role==='host'){state.code=mkCode();return rejoin()}state=null;show('sChoose');$('eChoose').textContent=m});
  sock.on('start_error',function(e){$('eLobby').textContent=ERR[e&&e.reason]||'Não foi possível iniciar.'});
  sock.on('lobby',onLobby);
  sock.on('room_closed',function(e){state=null;info(e&&e.reason==='host_left'?'O anfitrião saiu. A sala foi fechada.':'A sala expirou.')});
  sock.on('console_start',function(m){lastStart=m;launch()});
}
function mkCode(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';var b=new Uint8Array(6);crypto.getRandomValues(b);for(var i=0;i<6;i++)s+=a[b[i]%a.length];return s}
function rejoin(){if(!state)return;ready=false;sock.emit(state.role==='host'?'create_room':'join_room',{code:state.code,rom:R})}
$('bCreate').onclick=function(){state={role:'host',code:mkCode()};connect(rejoin)};
$('iCode').oninput=function(){this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6)};
$('bJoin').onclick=function(){var c=$('iCode').value.trim();if(c.length<4){$('eChoose').textContent='Escreve o código da sala.';return}state={role:'guest',code:c};connect(rejoin)};
function onLobby(l){
  if(!l||!state)return;state.code=l.code;
  if(l.phase!=='lobby'){if(lastStart)return;info('A partida desta sala já começou.');return}
  show('sLobby');$('tCode').textContent=l.code;$('eLobby').textContent='';
  var me=l.you,html='';for(var i=0;i<2;i++){var p=l.players[i];
    if(!p){html+='<div class="pl empty"><div class="av">?</div><div class="tx"><b>À espera do adversário…</b><small>Partilha o código</small></div></div>';continue}
    html+='<div class="pl'+(p.seat===me?' me':'')+'"><div class="av">'+(p.seat+1)+'</div><div class="tx"><b>'+esc(p.seat===me?'Tu':p.name)+(p.seat===0?' · anfitrião':'')+'</b><small>💿 '+esc(p.rom.name)+'</small></div><span class="pill'+(p.ready?' ok':'')+'">'+(p.ready?'PRONTO':(p.online?'A PREPARAR':'OFFLINE'))+'</span></div>'}
  $('players').innerHTML=html;
  var two=l.players.length===2,n=$('romNote');
  n.classList.toggle('hide',!two);if(two){n.className='note '+(l.sameRom?'ok':'bad');n.textContent=l.sameRom?'✓ Os dois têm o mesmo jogo':'⚠ Jogos diferentes — os dois têm de usar exatamente a mesma ISO'}
  var mine=l.players[me];ready=!!(mine&&mine.ready);$('bReady').textContent=ready?'CANCELAR PRONTO':'ESTOU PRONTO';$('bReady').classList.toggle('ghost',ready);
  var host=me===0;$('bStart').classList.toggle('hide',!host);
  $('bStart').disabled=!(two&&l.sameRom&&l.players.every(function(p){return p.ready&&p.online}));
}
$('bReady').onclick=function(){if(sock&&state)sock.emit('ready',{ready:!ready})};
$('bStart').onclick=function(){if(sock&&state){this.disabled=true;sock.emit('start',{})}};
$('bShare').onclick=function(){if(!state)return;if(A&&A.shareCode)A.shareCode(state.code);else if(navigator.share)navigator.share({text:'Código da sala Arena Console: '+state.code}).catch(function(){})};
$('bCopy').onclick=function(){if(!state)return;try{navigator.clipboard.writeText(state.code).then(function(){$('bCopy').textContent='COPIADO ✓';setTimeout(function(){$('bCopy').textContent='COPIAR'},1500)})}catch(e){}};
function launch(){
  if(!lastStart)return;show('sGo');$('goSpin').classList.remove('hide');$('goMsg').textContent='A abrir o Arena Console…';$('bRetry').classList.add('hide');
  if(A&&A.startConsole)A.startConsole(JSON.stringify(lastStart));
  else{$('goSpin').classList.add('hide');$('goMsg').textContent='Modo browser: '+JSON.stringify(lastStart)}
}
window.gaConsoleLaunched=function(ok,msg){$('goSpin').classList.add('hide');$('goMsg').textContent=ok?'Boa partida! 🎮 Podes voltar aqui quando acabar.':(msg||'Não foi possível abrir o Arena Console.');$('bRetry').classList.toggle('hide',!!ok)};
$('bRetry').onclick=launch;
$('bLeave').onclick=function(){try{if(sock)sock.emit('leave',{})}catch(e){}if(A&&A.close)A.close();else history.back()};
})();
</script>
</body></html>
