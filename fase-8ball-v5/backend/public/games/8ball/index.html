  socket=(window.GANet&&GANet.io||io)('https://gamer-fortune.onrender.com/pool',{path:'/ws',transports:['websocket']});

/* ===== GA8_V5: mesa do anfitrião sincronizada no multiplayer =====
   Anfitrião (lugar 0) é a fonte da verdade: emite change_scene {code,scene,token} ao entrar na sala, a cada room_update,
   no match_start e quando muda de mesa durante o jogo. O servidor guarda room.scene e retransmite scene_changed ao convidado
   (backend/services/pool-scene-sync.js). Continua a emitir o set_scene antigo antes do início, por compatibilidade. */
const scnNum=v=>{const n=typeof v==='string'&&v.trim()!==''?+v:v;return typeof n==='number'&&n%1===0&&n>=0&&SC[n]?n:null};

/* reprodução (interpolação) da trajetória simulada pelo servidor */
function stepReplay(t){const o=RP,ls=o.ls,F=ls.frames,nF=F.length,fi=Math.max(0,Math.min(nF-1,(t-o.t0)/ls.frameMs)),i0=Math.floor(fi),i1=Math.min(nF-1,i0+1),a=fi-i0,A_=F[i0],B_=F[i1];

  while(o.ei<ls.events.length&&ls.events[o.ei][0]<=i0){const e=ls.events[o.ei++];
    if(e[1]===0)sBall(e[2]);else if(e[1]===1)sRail(e[2]);
    else if(e[1]===2){const b=BL.find(x=>x.n===e[2]),q=PK[e[3]];if(b&&!b.in){b.in=true;b.pk=1;b.tx=q[0];b.ty=q[1];sPocket();fx.push({x:q[0],y:q[1],t:performance.now(),c:colOf(b.n)})}}}

/* ===================== GA8_V5 · TREINO vs CPU: física local, regras e IA ===================== */
/* Unidades da mesa: 1 u ≈ 2,54 mm (W=1000 u ≈ 2,54 m). Velocidades em u/s, acelerações em u/s².
   Modelo: deslizamento → rolamento (atrito do pano), rotação vertical (seguimento/puxada) e lateral (efeito),
   choques bola-bola com restituição e tabelas de borracha com atrito (o efeito lateral abre/fecha o ângulo). */
const PH={g:3862,muS:.2,muR:.015,zDec:650,eB:.95,eC:.8,muC:.2,vMin:140,vMax:3200,fps:60,ZS:-1,cap:400,tol:1.5};
const CG=31,MG=26;/* aberturas das caçapas de canto e do meio, medidas nas tabelas */
const CUSH=[[L+CG,T,L+W/2-MG,T,0,1],[L+W/2+MG,T,RR-CG,T,0,1],[L+CG,BB,L+W/2-MG,BB,0,-1],[L+W/2+MG,BB,RR-CG,BB,0,-1],[L,T+CG,L,BB-CG,1,0],[RR,T+CG,RR,BB-CG,-1,0]];
const JAWS=CUSH.flatMap(c=>[[c[0],c[1]],[c[2],c[3]]]);
const PAIM=[[L+14,T+14],[RR-14,T+14],[L+14,BB-14],[RR-14,BB-14],[L+W/2,T-5],[L+W/2,BB+5]];
const PH_C=12/(49*PH.muS*PH.g)+25/(98*PH.muR*PH.g);/* distância percorrida ≈ PH_C·v² (desliza e depois rola) */

function phImp(a,b){let nx=b.x-a.x,ny=b.y-a.y;const d=Math.hypot(nx,ny)||1;nx/=d;ny/=d;const v=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;if(v<=0)return 0;
  const j=v*(1+PH.eB)/2;a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny;const o=2*R-d;if(o>0){a.x-=nx*o/2;a.y-=ny*o/2;b.x+=nx*o/2;b.y+=ny*o/2}return v}
/* bolas encostadas (ex.: triângulo na abertura) chocam quase em simultâneo: impulsos em ordem aleatória até ninguém se aproximar */
function phHit(a,b,E,B){const v=phImp(a,b);if(!v)return;E.bb(a,b,v);if(!B)return;const g=[a,b],lim=(2*R+PH.tol)**2;
  for(let i=0;i<g.length;i++)for(const q of B)if(!q.in&&!g.includes(q)&&(q.x-g[i].x)**2+(q.y-g[i].y)**2<=lim)g.push(q);if(g.length<3)return;
  const C=[];for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++)if((g[i].x-g[j].x)**2+(g[i].y-g[j].y)**2<=lim)C.push([g[i],g[j]]);
  for(let it=0;it<40;it++){let any=0;for(let i=C.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[C[i],C[j]]=[C[j],C[i]]}
    for(const[p,q]of C){const w=phImp(p,q);if(w>1){any=1;if(w>60)E.bb(p,q,w)}}if(!any)break}}
/* n aponta para dentro da mesa; o atrito com a borracha troca velocidade tangencial por rotação lateral */
function phRail(p,nx,ny,sd,E){const vn=p.vx*nx+p.vy*ny;if(vn>=0)return;const tx=-ny,ty=nx,vt=p.vx*tx+p.vy*ty,ut=vt-p.wz,
  jt=-Math.sign(ut)*Math.min(PH.muC*(1+PH.eC)*-vn,Math.abs(ut)*2/7),vt2=vt+jt,vn2=-PH.eC*vn,wn=(p.wx*nx+p.wy*ny)*.2,wt=p.wx*tx+p.wy*ty;
  p.wz-=2.5*jt;p.vx=nx*vn2+tx*vt2;p.vy=ny*vn2+ty*vt2;p.wx=nx*wn+tx*wt;p.wy=ny*wn+ty*wt;if(sd<R){p.x+=nx*(R-sd);p.y+=ny*(R-sd)}E.rl(p,-vn)}
/* avança h segundos resolvendo os choques pela ordem exata em que acontecem */
function phStep(B,h,E){let rem=h,it=0;
  while(rem>1e-7&&it++<PH.cap){let tc=rem,ty=0,a=null,b=null,c=null;
    for(let i=0;i<B.length;i++){const p=B[i];if(p.in)continue;
      for(let j=i+1;j<B.length;j++){const q=B[j];if(q.in)continue;const vx=q.vx-p.vx,vy=q.vy-p.vy;if(!vx&&!vy)continue;
        const dx=q.x-p.x,dy=q.y-p.y,bb=dx*vx+dy*vy;if(bb>=0)continue;const cc=dx*dx+dy*dy-4*R*R;let t=0;
        if(cc>0){const aa=vx*vx+vy*vy,ds=bb*bb-aa*cc;if(ds<0)continue;t=(-bb-Math.sqrt(ds))/aa}
        if(t<tc){tc=t;ty=1;a=p;b=q}}
      if(!p.vx&&!p.vy)continue;
      for(const s of CUSH){const vn=p.vx*s[4]+p.vy*s[5];if(vn>=0)continue;const sd=(p.x-s[0])*s[4]+(p.y-s[1])*s[5];if(sd<0)continue;
        const t=sd<=R?0:(sd-R)/-vn;if(t>=tc)continue;const u=s[4]?p.y+p.vy*t:p.x+p.vx*t,lo=s[4]?s[1]:s[0],hi=s[4]?s[3]:s[2];
        if(u<lo||u>hi)continue;tc=t;ty=2;a=p;c=s}
      for(const s of JAWS){const dx=p.x-s[0],dy=p.y-s[1],bb=dx*p.vx+dy*p.vy;if(bb>=0)continue;const cc=dx*dx+dy*dy-R*R;let t=0;
        if(cc>0){const aa=p.vx*p.vx+p.vy*p.vy,ds=bb*bb-aa*cc;if(ds<0)continue;t=(-bb-Math.sqrt(ds))/aa}
        if(t<tc){tc=t;ty=3;a=p;c=s}}}
    for(const p of B)if(!p.in&&(p.vx||p.vy)){p.x+=p.vx*tc;p.y+=p.vy*tc}
    rem-=tc;
    if(ty===1)phHit(a,b,E,B);else if(ty===2)phRail(a,c[4],c[5],(a.x-c[0])*c[4]+(a.y-c[1])*c[5],E);
    else if(ty===3){const dx=a.x-c[0],dy=a.y-c[1],d=Math.hypot(dx,dy)||1;phRail(a,dx/d,dy/d,d,E)}else break}
  if(rem>1e-7)for(const p of B)if(!p.in){p.x+=p.vx*rem;p.y+=p.vy*rem}}

  cpuNext()}

async function cpuTurn(){if(CPU.busy)return;CPU.busy=true;const t=CPU.tok,ok=()=>t===CPU.tok;try{
  const t0=performance.now();cpuTmr('💭');const plan=aiPlan(LG,1,CPU.dif,ok);await sleep(650);if(!ok())return;say('🤖 A CPU está a pensar…');
  const pl=await plan;if(!ok()||!pl)return;const w=1500-(performance.now()-t0);if(w>0)await sleep(w);if(!ok())return;/* pausa de 1,5 s entre tacadas */
  if(LG.phase==='place'){const p=pl.place||lgFree(LG,BL[0].x,BL[0].y,1);await cpuMove(p.x,p.y,ok);if(!ok())return;
    LG.balls[0].x=p.x;LG.balls[0].y=p.y;LG.phase='aim';LG.turnId++;queue.push(cpuState(null));await cpuIdle();if(!ok())return;await sleep(280);if(!ok())return}
  cpuTmr('🎯');say('🤖 A CPU está a mirar…');await cpuAim(pl.ang,pl.pow,ok);if(!ok())return;await sleep(200);if(!ok())return;
  cpuTmr('');G.phase='shoot';G.t0=performance.now();cpuShot(1,pl.ang,pl.pow,pl.sp)}finally{CPU.busy=false}}
/* o taco da CPU roda até ao alvo (com uma pequena hesitação) e a barra de força enche — parece um jogador */
async function cpuAim(a1,p1,ok){const a0=aim,d=Math.atan2(Math.sin(a1-a0),Math.cos(a1-a0)),p0=pw,T0=performance.now(),dur=380+Math.min(520,Math.abs(d)*240),wob=(Math.random()-.5)*.05;
  for(;;){const u=Math.min(1,(performance.now()-T0)/dur),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;aim=a0+d*e+Math.sin(u*Math.PI)*wob;pw=p0+(p1-p0)*e;paintPw();if(u>=1)break;await sleep(16);if(!ok())return}
  aim=a1;pw=p1;paintPw()}
async function cpuMove(x,y,ok){const c=BL[0],x0=c.x,y0=c.y,T0=performance.now();for(;;){const u=Math.min(1,(performance.now()-T0)/450),e=1-Math.pow(1-u,3);c.x=x0+(x-x0)*e;c.y=y0+(y-y0)*e;lastSig='';if(u>=1)break;await sleep(16);if(!ok())return}}
